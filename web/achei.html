<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achei um carro roubado · AutoLink</title>
<link rel="icon" href="icon3-192.png">
<style>
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f4f4f6;color:#111}
header{background:#111;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
header img{height:30px}header span{color:#FF6B00}header a{color:#FF6B00;text-decoration:none;font-size:22px;margin-right:4px}
main{max-width:520px;margin:0 auto;padding:16px}
.warn{background:#fee2e2;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:12px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;font-size:16px;margin-bottom:8px;background:#fff}
button{width:100%;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:16px}
.s{background:#ef4444;color:#fff}.g{background:#fff;border:2px solid #111;color:#111;margin-bottom:8px}
.m{color:#666;font-size:13px}.ok{background:#e8f8ee;border:1px solid #22c55e;border-radius:12px;padding:14px;line-height:1.5}
label.ck{display:flex;gap:8px;align-items:center;font-weight:700;margin:6px 0 10px}label.ck input{width:20px;height:20px;margin:0;flex:none}
#ph img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px}
</style>
</head>
<body>
<header><a href="procurados.html" aria-label="Voltar">‹</a><img src="logo-car-white.png" alt="">Achei um <span>carro</span></header>
<main id="app">
<div class="warn"><b>Não se aproxime</b> do carro e não aborde ninguém. Em caso de risco, ligue <b>190</b>. Você não precisa escanear o adesivo.</div>
<input id="pl" placeholder="Placa (ex: ABC1D23)" maxlength="8" autocapitalize="characters" autocomplete="off">
<input id="md" placeholder="Modelo (ex: Onix, HB20)" maxlength="40">
<input id="cl" placeholder="Cor" maxlength="30">
<textarea id="nt" maxlength="300" placeholder="O que você viu? (rua, direção, pessoas...)" style="min-height:70px"></textarea>
<button type="button" class="g" id="loc">Incluir localização</button>
<div id="ph"></div><label class="g" style="display:block;text-align:center;padding:12px;border-radius:12px;font-weight:800;margin-bottom:8px">Adicionar foto (opcional, de longe)<input type="file" accept="image/*" id="phi" hidden></label>
<label class="ck"><input type="checkbox" id="anon" checked> Enviar anônimo</label>
<div id="idf" style="display:none"><input id="nm" placeholder="Seu nome" maxlength="80"><input id="wa" placeholder="Seu WhatsApp com DDD" inputmode="tel" maxlength="20"><p class="m" style="margin-top:0">Seu nome e telefone só a equipe AutoLink vê.</p></div>
<button class="s" id="go">Enviar para a AutoLink</button>
</main>
<script>
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I',BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents';
const $=id=>document.getElementById(id);let pos=null,photo=null;
const enc=v=>v instanceof Date?{timestampValue:v.toISOString()}:{stringValue:String(v)};
$('pl').value=(new URLSearchParams(location.search).get('plate')||'').toUpperCase();
$('anon').onchange=e=>{$('idf').style.display=e.target.checked?'none':'block';};
$('loc').onclick=e=>{e.target.textContent='Obtendo localização...';navigator.geolocation.getCurrentPosition(p=>{pos=p.coords;e.target.textContent='Localização incluída ✓';},()=>{e.target.textContent='Não foi possível pegar a localização';},{enableHighAccuracy:true,timeout:15000});};
$('phi').onchange=()=>{const f=$('phi').files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.55);$('ph').innerHTML='<img src="'+photo+'" alt="">';};img.src=URL.createObjectURL(f);};
$('go').onclick=async e=>{
  const plate=$('pl').value.toUpperCase().replace(/[^A-Z0-9]/g,''),anon=$('anon').checked,wa=$('wa').value.replace(/\D/g,'');
  if(plate.length<7)return alert('Digite a placa completa.');if(!pos&&!$('nt').value.trim())return alert('Inclua a localização ou conte onde viu o carro.');
  if(!anon&&($('nm').value.trim().length<2||wa.length<10))return alert('Para se identificar, preencha nome e WhatsApp. Ou marque "Enviar anônimo".');
  const b=e.target;b.disabled=true;b.textContent='Enviando...';
  try{const r=await(await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'})).json();
    const d={by:r.localId,plate,model:$('md').value.trim(),color:$('cl').value.trim(),note:$('nt').value.trim(),at:new Date()};
    if(pos){d.lat=String(pos.latitude);d.lng=String(pos.longitude);}if(photo)d.photo=photo;if(!anon){d.name=$('nm').value.trim();d.wa=wa;}
    const x=await fetch(BASE+'/sightReports',{method:'POST',headers:{Authorization:'Bearer '+r.idToken,'Content-Type':'application/json'},body:JSON.stringify({fields:Object.fromEntries(Object.entries(d).map(([k,v])=>[k,enc(v)]))})});
    if(!x.ok)throw new Error('falha');
    $('app').innerHTML='<div class="ok"><b>Obrigado!</b> A equipe AutoLink recebeu e vai conferir com os carros roubados registrados. Não se aproxime do veículo. Em caso de risco, ligue 190.</div>';
  }catch(err){alert('Não foi possível enviar agora. Tente de novo.');b.disabled=false;b.textContent='Enviar para a AutoLink';}
};
</script>
</body>
</html>
