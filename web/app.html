<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>AutoLink</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon3-192.png"><link rel="apple-touch-icon" href="icon3-180.png">
<meta name="theme-color" content="#0b0b0c"><script>try{if(localStorage.getItem("al_theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AutoLink">
<style>
:root{--bg:#0b0b0c;--card:#17171a;--card2:#1f1f23;--line:#2a2a2f;--tx:#f4f4f5;--mut:#9a9aa3;--or:#FF6B00;--or2:#ff8a33;--ok:#22c55e;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,"SF Pro Text",Inter,Arial,sans-serif;color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff0d}
header img{width:32px;height:32px;border-radius:9px}header .t{flex:1;font-size:21px;font-weight:900;letter-spacing:-.5px}header .t span{color:var(--or)}
header button{background:none;border:0;color:var(--or);font-size:15px;font-weight:700;padding:6px}
main{padding:16px;max-width:560px;margin:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
h2{font-size:18px;margin:22px 0 12px;font-weight:800;letter-spacing:-.2px}.muted{color:var(--mut);font-size:13px}
.card{background:var(--card);padding:14px 16px;border-radius:16px;margin-bottom:10px;border:1px solid var(--line);display:block;width:100%;text-align:left;font:inherit;color:inherit}
button.card:active{background:var(--card2)}.card b{font-size:16px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font-size:16px;margin-bottom:10px;background:var(--card);color:var(--tx);outline:none}
input:focus{border-color:var(--or)}input::placeholder{color:#6b6b73}
.btn{width:100%;background:linear-gradient(180deg,var(--or2),var(--or));color:#111;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:800;margin-bottom:8px;box-shadow:0 6px 18px #ff6b0033}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.link{display:block;text-align:center;color:var(--or);font-weight:700;margin-top:14px;background:none;border:0;font-size:15px;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:#ff6b001f;border:1px solid #ff6b0040;border-radius:20px;padding:7px 12px;font-size:14px;color:var(--tx)}
.sw{position:relative;width:50px;height:30px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#3a3a40;border-radius:30px;transition:.2s}
.sw span:before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--or)}.sw input:checked+span:before{transform:translateX(20px)}
.code{font-size:24px;font-weight:900;letter-spacing:2px;text-align:center;color:var(--or)}
#msgs{display:flex;flex-direction:column;gap:6px;margin:10px 0}.b{padding:10px 13px;border-radius:18px;max-width:80%;white-space:pre-wrap;word-wrap:break-word;line-height:1.35}
.me{background:var(--or);color:#111;align-self:flex-end;border-bottom-right-radius:6px}.them{background:var(--card2);align-self:flex-start;border-bottom-left-radius:6px}
.composer{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line);z-index:7}
.composer .in{display:flex;gap:8px;max-width:560px;margin:auto}.composer input{margin:0}.composer .btn{width:auto;margin:0;padding:0 18px}
.composer .q{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:0 auto 8px}.composer .q .chip{white-space:nowrap}
.logo-big{display:block;width:96px;height:96px;margin:30px auto 10px;border-radius:24px;box-shadow:0 10px 40px #ff6b0040}
.warn{background:#ff6b0014;border:1px solid #ff6b0055;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:20px;line-height:1.45}
.err{color:var(--red)}
/* Início */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,#ff6b0033 0%,transparent 55%),var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:6px}
.hero .lbl{color:var(--or);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.hero .nm{font-size:26px;font-weight:900;letter-spacing:-.5px;margin:4px 0 2px}.hero .pl{color:var(--mut);font-size:14px;letter-spacing:.5px}
.hero .st{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:20px}
.st.on{background:#22c55e1f;color:var(--ok)}.st.off{background:#ef44441f;color:var(--red)}.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero svg.car{position:absolute;right:-6px;bottom:8px;width:120px;opacity:.95}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:6px;height:6px;border-radius:50%;background:#3a3a40}.dots i.a{background:var(--or);width:18px;border-radius:4px}
.alert{display:flex;gap:12px;align-items:center}.alert .ic{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#22c55e1f}
.alert .ic.or{background:#ff6b001f}.alert svg{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.sc{background:none;border:0;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:0}
.sc .ic{width:58px;height:58px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.sc:active .ic{background:var(--card2);transform:scale(.95)}.sc svg{width:26px;height:26px}
.ad{display:flex;gap:12px;align-items:center;border:1px dashed #ff6b0066;border-radius:16px;padding:14px;margin-top:22px;background:#ff6b000d}
.ad .tag{margin-left:auto;font-size:10px;font-weight:800;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
/* Barra inferior */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(17,17,19,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
#tabs[hidden]{display:none}
#tabs button{background:none;border:0;color:#8a8a93;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 0}
#tabs button svg{width:24px;height:24px}#tabs button.on{color:var(--or)}
#tabs .scan{position:relative;top:-18px}
#tabs .scan span{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,var(--or2),var(--or));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px #ff6b0066,0 0 0 6px var(--bg)}
#tabs .scan svg{width:30px;height:30px}
/* Aviso "em construção" */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,20px);opacity:0;transition:.25s;background:#26262b;border:1px solid var(--line);color:var(--tx);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 10px 30px #0008;width:max-content;max-width:88vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.soon{text-align:center;padding:50px 20px}.soon .big{font-size:56px}.soon h2{font-size:22px}
/* Leitor */
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none}#scan video{width:100%;height:100%;object-fit:cover}
#scan .frame{position:absolute;top:50%;left:50%;width:70vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid var(--or);border-radius:28px;box-shadow:0 0 0 9999px #000a}
#scan .tx{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);color:#fff;text-align:center;font-weight:700;font-size:17px;padding:0 20px}
#scan .close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111;font-size:20px}

#menu{color:var(--tx)!important}
#drawer{position:fixed;inset:0;z-index:25}#drawer .dbg{position:absolute;inset:0;background:#0009;animation:fi .2s}
#drawer aside{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:320px;background:var(--card);border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 16px) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;animation:si .22s}
@keyframes si{from{transform:translateX(-100%)}}@keyframes fi{from{opacity:0}}
.dh{display:flex;gap:12px;align-items:center;padding:4px 18px 18px;border-bottom:1px solid var(--line);margin-bottom:8px}.dh img{width:44px;height:44px;border-radius:12px}.dh b{font-size:20px}
.di{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--tx);font-size:16px;font-weight:600;padding:14px 18px;text-align:left}.di svg{width:22px;height:22px;color:var(--mut)}.di:active{background:var(--card2)}
.di .tg{margin-left:auto;display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}.di .tg i{font-style:normal;font-size:13px;padding:5px 10px;border-radius:8px;color:var(--mut)}.di .tg i.on{background:var(--or);color:#111}
/* Alerta perto */
.danger{text-decoration:none;display:flex;gap:12px;align-items:center;background:#dc2626;color:#fff;border-radius:18px;padding:14px 16px;margin:4px 0 12px;animation:blink 1.1s infinite;box-shadow:0 0 0 0 #dc262699;border:0;width:100%;text-align:left;font:inherit}
.danger .ic{width:40px;height:40px;border-radius:12px;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.danger b{font-size:16px}.danger small{opacity:.9}
@keyframes blink{0%,100%{background:#dc2626;box-shadow:0 0 0 0 #dc262699}50%{background:#ff3b3b;box-shadow:0 0 0 10px #dc262600}}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.types button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;color:var(--tx);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}.types button span{font-size:26px}.types button.on{border-color:var(--or);background:#ff6b0022}
textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:16px;margin-bottom:10px;background:var(--card);color:var(--tx);min-height:90px;resize:vertical}
.gps{display:flex;gap:10px;align-items:center;margin-bottom:12px}
/* Tema claro */
:root[data-theme=light]{--bg:#f4f4f6;--card:#ffffff;--card2:#f0f0f3;--line:#e4e4e9;--tx:#111114;--mut:#6b6b75}
:root[data-theme=light] header{background:rgba(255,255,255,.85);border-bottom-color:#0000000d}
:root[data-theme=light] #tabs{background:rgba(255,255,255,.92)}:root[data-theme=light] .composer{background:rgba(244,244,246,.92)}
:root[data-theme=light] #toast{background:#111;color:#fff}:root[data-theme=light] .them{background:#e9e9ee}
.pill{margin-left:auto;font-size:11px;font-weight:800;background:#ff6b0022;color:var(--or);border-radius:20px;padding:3px 9px}
.dacc{margin:14px 18px 0;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}.dacc b{display:block;font-size:14px;word-break:break-all}.dacc .chip{display:block}
.faq summary{list-style:none;cursor:pointer}.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:'+';float:right;color:var(--or);font-weight:800}.faq[open] summary:after{content:'–'}
header img.lc{height:26px;width:auto;border-radius:0}.dh img.lcd{height:34px;width:auto;border-radius:0}
.logo-big{width:auto;height:auto;box-shadow:none;text-align:center;margin:30px auto 6px}.logo-big img{width:230px;max-width:70%}
.lcb{display:none!important}:root[data-theme=light] .lcb{display:inline!important}:root[data-theme=light] .lcw{display:none!important}
.logo-big .lcb,.logo-big .lcw{margin:auto}
#tabs{display:block!important;padding:0 0 calc(env(safe-area-inset-bottom) + 4px)}#tabs[hidden]{display:none!important}
#tabs button.adbar{flex-direction:row;justify-content:flex-start;font-weight:400;color:var(--tx);display:flex;align-items:center;gap:10px;margin:0;padding:9px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#ff6b001a,transparent);width:100%;border-left:0;border-right:0;border-top:0;color:var(--tx);text-align:left;font-size:13px}
#tabs .adbar b{font-size:13px}#tabs .adbar .muted{font-size:11px}#tabs .adbar .tag{margin-left:auto;font-size:10px;font-weight:800;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#tabs .trow{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px 0}
#tabs .trow button{background:none;border:0;color:#8a8a93;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 0}
#tabs .trow button.on{color:var(--or)}#tabs .trow button svg{width:24px;height:24px}
#tabs .scan{position:relative;top:-6px}#tabs .scan span{width:62px;height:62px}
main{padding-bottom:calc(env(safe-area-inset-bottom) + 150px)}
</style></head><body>
<header><button id="menu" aria-label="Menu" style="padding:4px 6px 4px 0"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button id="back" hidden>‹ Voltar</button><img class="lc lcw" src="logo-car-white.png" alt=""><img class="lc lcb" src="logo-car.png" alt=""><div class="t">Auto<span>Link</span></div><button id="out" hidden>Sair</button></header>
<main id="m"></main>
<nav id="tabs" hidden></nav>
<div id="drawer" hidden><div class="dbg"></div><aside><div class="dh"><img class="lcd lcw" src="logo-car-white.png" alt=""><img class="lcd lcb" src="logo-car.png" alt=""><div><b>Auto<span style="color:var(--or)">Link</span></b><div class="muted" id="dEmail"></div></div></div><div id="dItems"></div><div class="muted" style="margin-top:auto;padding:16px">Versão 1.0 · beta</div></aside></div><div id="toast"></div>
<div id="scan"><video playsinline muted></video><div class="frame"></div><div class="tx" id="scanTx">Aponte para o QR code do adesivo AutoLink</div><button class="close" id="scanX" aria-label="Fechar">✕</button></div>
<script>
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I';
const BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents';
const ID='https://identitytoolkit.googleapis.com/v1/accounts:';
const m=document.getElementById('m'),back=document.getElementById('back'),out=document.getElementById('out');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>m.querySelector(s);
const ICON={"home": "<path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/>", "car": "<path d=\"M5 17H3v-5l2-5h11l3 5h2v5h-2\"/><circle cx=\"7.5\" cy=\"17\" r=\"2\"/><circle cx=\"16.5\" cy=\"17\" r=\"2\"/><path d=\"M9.5 17h5M5 12h14\"/>", "scan": "<path d=\"M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10\"/>", "store": "<path d=\"M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6\"/>", "bell": "<path d=\"M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4\"/>", "qr": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><path d=\"M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4\"/>", "wrench": "<path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z\"/>", "doc": "<path d=\"M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h6\"/>", "siren": "<path d=\"M6 18v-6a6 6 0 1 1 12 0v6M4 21h16v-3H4zM12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4\"/>", "pin": "<path d=\"M12 21s-7-6.2-7-11.5a7 7 0 1 1 14 0C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/>", "shield": "<path d=\"M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z\"/><path d=\"m9 12 2 2 4-4\"/>", "mega": "<path d=\"M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6\"/>", "msg": "<path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"/>"};
const ic=(n,c="currentColor",w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
let timer=null;const poll=(fn,ms=3000)=>{clearInterval(timer);fn();timer=setInterval(fn,ms);};

// ---------- Sessão ----------
let S=null;
const store={get(){try{return JSON.parse(localStorage.getItem('al_owner')||'null')}catch(e){return null}},set(v){try{v?localStorage.setItem('al_owner',JSON.stringify(v)):localStorage.removeItem('al_owner')}catch(e){}}};
async function post(url,body){return (await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();}
function save(r,email){S={uid:r.localId||r.user_id,token:r.idToken||r.id_token,refresh:r.refreshToken||r.refresh_token,email,exp:Date.now()+50*60e3};store.set(S);return S;}
async function refresh(){const sv=store.get();if(!sv)return null;
  const r=await (await fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+sv.refresh})).json();
  if(!r.id_token){store.set(null);return null;}return save(r,sv.email);}
const ERR={EMAIL_EXISTS:'Este e-mail já tem conta. Use "Entrar".',INVALID_LOGIN_CREDENTIALS:'E-mail ou senha incorretos.',INVALID_PASSWORD:'E-mail ou senha incorretos.',EMAIL_NOT_FOUND:'E-mail não cadastrado.',INVALID_EMAIL:'E-mail inválido.',MISSING_PASSWORD:'Digite a senha.',TOO_MANY_ATTEMPTS_TRY_LATER:'Muitas tentativas. Tente mais tarde.'};
const msg=r=>{const x=r.error?.message||'erro';return ERR[x.split(' ')[0]]||(x.startsWith('WEAK_PASSWORD')?'Senha fraca: use pelo menos 6 caracteres.':x);};

// ---------- Banco de dados ----------
const enc=v=>typeof v==='boolean'?{booleanValue:v}:v instanceof Date?{timestampValue:v.toISOString()}:{stringValue:String(v)};
const dec=f=>'booleanValue' in f?f.booleanValue:'timestampValue' in f?new Date(f.timestampValue):'nullValue' in f?null:f.stringValue;
const fields=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,enc(v)]));
const unpack=d=>({id:d.name.split('/').pop(),...Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,dec(v)]))});
async function api(path,method='GET',body){
  if(Date.now()>S.exp)await refresh();
  const r=await fetch(BASE+path,{method,headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||JSON.stringify(j));return j;}
const add=async(col,data)=>unpack(await api('/'+col,'POST',{fields:fields(data)}));
const update=(path,data)=>api('/'+path+'?'+Object.keys(data).map(k=>'updateMask.fieldPaths='+k).join('&'),'PATCH',{fields:fields(data)});
async function find(col,filters,order,parent=''){
  const q={from:[{collectionId:col}]};
  if(filters.length)q.where={compositeFilter:{op:'AND',filters:filters.map(([f,v])=>({fieldFilter:{field:{fieldPath:f},op:'EQUAL',value:enc(v)}}))}};
  if(order)q.orderBy=[{field:{fieldPath:order},direction:'ASCENDING'}];
  return (await api(parent+':runQuery','POST',{structuredQuery:q})).filter(x=>x.document).map(x=>unpack(x.document));}

// ---------- Leitor de QR ----------
let stream=null,scanning=false;
async function startScan(){
  const box=document.getElementById('scan'),v=box.querySelector('video'),tx=document.getElementById('scanTx');
  tx.textContent='Aponte para o QR code do adesivo AutoLink';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});}
  catch(e){return alert('Não foi possível abrir a câmera. Permita o acesso à câmera para o AutoLink nos ajustes do celular.');}
  box.style.display='block';v.srcObject=stream;await v.play().catch(()=>{});scanning=true;
  const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(!scanning)return;
    if(v.readyState>=2){const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,800/Math.max(w,h));c.width=w*k;c.height=h*k;ctx.drawImage(v,0,0,c.width,c.height);
      let r=null;if(window.jsQR)r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      else if(!window._jsqrWarn){window._jsqrWarn=1;tx.textContent='Carregando leitor... verifique sua internet.';}
      if(r&&r.data){const u=handleQR(r.data);if(u){stopScan();location.href=u;return;}tx.textContent='Esse QR code não é de um adesivo AutoLink.';}}
    requestAnimationFrame(tick);};
  tick();}
function stopScan(){scanning=false;document.getElementById('scan').style.display='none';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
document.getElementById('scanX').onclick=stopScan;
function handleQR(text){try{const u=new URL(text);const here=new URL('./',location.href);
  if(u.origin===here.origin&&u.pathname.startsWith(here.pathname)&&(u.searchParams.get('s')||u.searchParams.get('c'))){
    const q=u.searchParams.get('s')?'s='+encodeURIComponent(u.searchParams.get('s')):'c='+encodeURIComponent(u.searchParams.get('c'));return 'index.html?'+q+'&from=app';}}catch(e){}return null;}

  $('#pp').onclick=()=>toast('🚧 Plano Premium em construção. Em breve!');}
function Advertise(){
  m.innerHTML=`<h2>Anuncie no AutoLink</h2><p class="muted">Apareça para motoristas da sua região: oficinas, autopeças, lava-jatos, seguros e muito mais. Preencha e nossa equipe entra em contato.</p>

  <input id="c" placeholder="Cidade" maxlength="60"><input id="seg" placeholder="Ramo (ex: oficina, autopeças)" maxlength="60">

const FAQ=[['Como funciona o adesivo?','Você cola o adesivo AutoLink no carro. Quem precisar falar com você escaneia o QR e manda mensagem, sem ver seu nome ou telefone.'],
 ['Como ativo meu adesivo?','Em Garagem, toque no carro e em "Ativar adesivo". Digite o código e o PIN do cartão de ativação que veio na embalagem.'],
 ['Perdi o cartão com o PIN','Fale com a equipe aqui na Central de ajuda informando o código do adesivo.'],
 ['Alguém está me incomodando','Abra a conversa e toque em Bloquear ou Denunciar. A pessoa não consegue mais te mandar mensagens.'],
 ['Vendi meu carro','Apague o carro em Garagem. O adesivo fica livre para o novo dono ativar com o PIN.'],
 ['Como funcionam os alertas da região?','Qualquer motorista pode enviar um alerta (incêndio, enchente...). Após análise da equipe, ele aparece para quem estiver a até 300 m.']];
function Help(){
  m.innerHTML=`<h2>Central de ajuda</h2>${FAQ.map(([q,a])=>`<details class="card faq"><summary><b style="font-size:15px">${q}</b></summary><p class="muted" style="margin:8px 0 0;font-size:14px">${a}</p></details>`).join('')}
  <h2>Falar com a equipe</h2><div id="tk"><p class="muted">Carregando...</p></div><button class="btn" id="nt">+ Nova mensagem</button>`;
  $('#nt').onclick=async()=>{const t=prompt('Escreva sua dúvida ou problema:');if(!t||!t.trim())return;
    try{const now=new Date();const tk=await add('tickets',{userId:S.uid,email:S.email||'',status:'open',lastMsg:t.trim(),updatedAt:now,createdAt:now,unreadUser:false});
      await add('tickets/'+tk.id+'/messages',{text:t.trim(),from:'user',at:now});go(Ticket,tk);}catch(e){alert('Erro: '+e.message);}};
  const load=async()=>{const l=(await find('tickets',[['userId',S.uid]])).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));const box=$('#tk');if(!box)return;
    box.innerHTML=l.length?'':'<p class="muted">Nenhuma conversa com a equipe ainda.</p>';
    for(const t of l){const b=document.createElement('button');b.className='card';
      b.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.unreadUser?'🟠 ':''}${esc(t.lastMsg)}</span><span class="pill">${t.status==='closed'?'Resolvido':'Aberto'}</span></div><div class="muted">${t.updatedAt?t.updatedAt.toLocaleString('pt-BR'):''}</div>`;
      b.onclick=()=>go(Ticket,t);box.appendChild(b);}};
  poll(()=>load().catch(()=>{}),10000);}
function Ticket(t){
  m.innerHTML=`<h2>Equipe AutoLink</h2><div id="msgs"></div><div class="composer"><form class="in" id="f"><input id="t" placeholder="Escreva..." maxlength="1000" autocomplete="off"><button class="btn">Enviar</button></form></div>`;
  let last='';const load=async()=>{const ms=await find('messages',[],'at','/tickets/'+t.id);const html=ms.map(x=>`<div class="b ${x.from==='user'?'me':'them'}">${x.from==='team'?'<b style="font-size:12px;color:var(--or)">Equipe AutoLink</b><br>':''}${esc(x.text)}</div>`).join('');
    if(html!==last){last=html;$('#msgs').innerHTML=html;scrollTo(0,document.body.scrollHeight);}
    if(t.unreadUser){t.unreadUser=false;update('tickets/'+t.id,{unreadUser:false}).catch(()=>{});}};
  $('#f').onsubmit=async e=>{e.preventDefault();const v=$('#t').value.trim();if(!v)return;$('#t').value='';
    try{const now=new Date();await add('tickets/'+t.id+'/messages',{text:v,from:'user',at:now});await update('tickets/'+t.id,{lastMsg:v,updatedAt:now,status:'open',unreadTeam:true});load();}catch(err){alert('Erro: '+err.message);}};
  poll(()=>load().catch(()=>{}),4000);}
document.getElementById('menu').onclick=openMenu;

// ---------- Alertas regionais ----------
const ATYPES={incendio:['🔥','Incêndio'],enchente:['🌊','Enchente'],acidente:['💥','Acidente'],bloqueio:['🚧','Via bloqueada'],roubo:['🚨','Roubo / assalto'],outro:['⚠️','Outro']};
const RAIO=300;
function dist(a,b,c,d){const R=6371e3,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function gps(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('GPS indisponível'));
  navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>no(e),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});});}
function NewAlert(){
  let type=null,pos=null;
  m.innerHTML=`<h2>Criar alerta regional</h2><p class="muted">Avise os motoristas num raio de ${RAIO} m. O alerta passa por análise da equipe AutoLink antes de aparecer.</p>
  <div class="types">${Object.entries(ATYPES).map(([k,[e,l]])=>`<button data-t="${k}"><span>${e}</span>${l}</button>`).join('')}</div>
  <textarea id="ds" maxlength="300" placeholder="Descreva o que está acontecendo (ex: incêndio em terreno na esquina da rua X)"></textarea>
  <div class="card gps"><span style="font-size:22px">📍</span><div style="flex:1"><b style="font-size:15px">Localização</b><div class="muted" id="gt">Obtendo sua localização...</div></div><button class="chip" id="gr">Atualizar</button></div>
  <button class="btn" id="sv">Enviar alerta para análise</button>`;
  m.querySelectorAll('.types button').forEach(b=>b.onclick=()=>{type=b.dataset.t;m.querySelectorAll('.types button').forEach(x=>x.classList.toggle('on',x===b));});
  const locate=()=>{$('#gt').textContent='Obtendo sua localização...';gps().then(p=>{pos=p;$('#gt').textContent=`Pronto · precisão de ${Math.round(p.acc)} m`;})
    .catch(()=>{pos=null;$('#gt').innerHTML='<span class="err">Não foi possível pegar o GPS. Permita a localização para o AutoLink nos ajustes do celular.</span>';});};
  $('#gr').onclick=locate;locate();
  $('#sv').onclick=async()=>{if(!type)return toast('Escolha o tipo do alerta');if(!pos)return toast('Aguarde a localização (GPS)');
    const b=$('#sv');b.disabled=true;b.textContent='Enviando...';
    try{await add('alerts',{type,desc:$('#ds').value.trim(),lat:String(pos.lat),lng:String(pos.lng),authorId:S.uid,status:'pending',createdAt:new Date()});
      alert('Alerta enviado! ✅\n\nNossa equipe vai analisar e, se aprovado, ele aparece para os motoristas da região.');go(Home);}
    catch(e){alert('Erro: '+e.message);b.disabled=false;b.textContent='Enviar alerta para análise';}};
}
async function nearAlerts(){
  let pos;try{pos=await gps();}catch(e){return;}
  let list=[];try{list=await find('alerts',[['status','approved']]);}catch(e){return;}
  const now=Date.now();
  const near=list.filter(a=>!(a.expiresAt&&a.expiresAt<now)).map(a=>({...a,d:dist(pos.lat,pos.lng,+a.lat,+a.lng)})).filter(a=>a.d<=RAIO).sort((a,b)=>a.d-b.d);
  const box=document.getElementById('danger');if(!box)return;
  box.innerHTML=near.map(a=>{const [e,l]=ATYPES[a.type]||ATYPES.outro;return `<a class="danger" target="_blank" href="https://www.google.com/maps?q=${+a.lat},${+a.lng}"><span class="ic">${e}</span><div><b>${l} a ${Math.round(a.d)} m de você</b><br><small>${esc(a.desc||'Alerta na sua região. Tenha cuidado.')}</small></div></a>`;}).join('');
  if(near.length&&navigator.vibrate)navigator.vibrate([200,100,200]);
}
