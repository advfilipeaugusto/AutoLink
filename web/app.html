<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>AutoLink</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" defer></script>
<link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><link rel="apple-touch-icon" href="icon2-180.png">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AutoLink">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#f5f5f5;color:#111;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:8px}header .t{flex:1;font-size:22px;font-weight:900;letter-spacing:-.5px}header .t span{color:#FF6B00}
header button{background:none;border:0;color:#FF6B00;font-size:16px;font-weight:700;padding:6px}
main{padding:16px;max-width:560px;margin:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 90px)}
h2{font-size:19px;margin:18px 0 10px}.muted{color:#777;font-size:13px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:8px;border-left:5px solid #FF6B00;display:block;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
.card b{font-size:16px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;font-size:16px;margin-bottom:8px;background:#fff}
.btn{width:100%;background:#FF6B00;color:#111;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:800;margin-bottom:8px}
.btn:disabled{opacity:.6}.link{display:block;text-align:center;color:#FF6B00;font-weight:700;margin-top:14px;background:none;border:0;font-size:15px;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:#FFE1CC;border:0;border-radius:16px;padding:7px 12px;font-size:14px;color:#111}
.sw{position:relative;width:50px;height:30px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#ccc;border-radius:30px;transition:.2s}
.sw span:before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:#FF6B00}.sw input:checked+span:before{transform:translateX(20px)}
.code{font-size:24px;font-weight:900;letter-spacing:2px;text-align:center}
#msgs{display:flex;flex-direction:column;gap:6px;margin:10px 0}.b{padding:10px 12px;border-radius:14px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.me{background:#FF6B00;align-self:flex-end}.them{background:#111;color:#fff;align-self:flex-start}
.composer{position:fixed;left:0;right:0;bottom:0;background:#f5f5f5;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid #e5e5e5}
.composer .in{display:flex;gap:8px;max-width:560px;margin:auto}.composer input{margin:0}.composer .btn{width:auto;margin:0;padding:0 18px}
.composer .q{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:0 auto 8px}.composer .q .chip{white-space:nowrap}
.logo-big{display:block;width:96px;height:96px;margin:30px auto 10px;border-radius:22px}
.warn{background:#fff3e8;border:1px solid #FF6B00;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.err{color:#c00}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:72px;height:72px;border-radius:50%;background:#FF6B00;border:5px solid #111;box-shadow:0 6px 20px #0005;display:flex;align-items:center;justify-content:center;z-index:6}
.fab svg{width:34px;height:34px}.fabl{position:fixed;left:0;right:0;text-align:center;bottom:calc(env(safe-area-inset-bottom) + 2px);font-size:11px;font-weight:700;z-index:6;pointer-events:none}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none}#scan video{width:100%;height:100%;object-fit:cover}
#scan .frame{position:absolute;top:50%;left:50%;width:70vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #FF6B00;border-radius:24px;box-shadow:0 0 0 9999px #0008}
#scan .tx{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);color:#fff;text-align:center;font-weight:700;font-size:17px;padding:0 20px}
#scan .close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:20px}
</style></head><body>
<header><button id="back" hidden>‹ Voltar</button><img src="logo.svg" alt=""><div class="t">Auto<span>Link</span></div><button id="out" hidden>Sair</button></header>
<main id="m"></main>
<div id="scan"><video playsinline muted></video><div class="frame"></div><div class="tx" id="scanTx">Aponte para o QR code do adesivo AutoLink</div><button class="close" id="scanX" aria-label="Fechar">✕</button></div>
<script>
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I';
const BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents';
const ID='https://identitytoolkit.googleapis.com/v1/accounts:';
const m=document.getElementById('m'),back=document.getElementById('back'),out=document.getElementById('out');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>m.querySelector(s);
let timer=null;const poll=(fn,ms=3000)=>{clearInterval(timer);fn();timer=setInterval(fn,ms);};

// ---------- Sessão ----------
let S=null;
const store={get(){try{return JSON.parse(localStorage.getItem('al_owner')||'null')}catch(e){return null}},set(v){try{v?localStorage.setItem('al_owner',JSON.stringify(v)):localStorage.removeItem('al_owner')}catch(e){}}};
async function post(url,body){return (await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();}
function save(r,email){S={uid:r.localId||r.user_id,token:r.idToken||r.id_token,refresh:r.refreshToken||r.refresh_token,email,exp:Date.now()+50*60e3};store.set(S);return S;}
async function refresh(){const sv=store.get();if(!sv)return null;
  const r=await (await fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+sv.refresh})).json();
  if(!r.id_token){store.set(null);return null;}return save(r,sv.email);}
const ERR={EMAIL_EXISTS:'Este e-mail já tem conta. Use "Entrar".',INVALID_LOGIN_CREDENTIALS:'E-mail ou senha incorretos.',INVALID_PASSWORD:'E-mail ou senha incorretos.',EMAIL_NOT_FOUND:'E-mail não cadastrado.',INVALID_EMAIL:'E-mail inválido.',MISSING_PASSWORD:'Digite a senha.',TOO_MANY_ATTEMPTS_TRY_LATER:'Muitas tentativas. Tente mais tarde.'};
const msg=r=>{const x=r.error?.message||'erro';return ERR[x.split(' ')[0]]||(x.startsWith('WEAK_PASSWORD')?'Senha fraca: use pelo menos 6 caracteres.':x);};

// ---------- Banco de dados ----------
const enc=v=>typeof v==='boolean'?{booleanValue:v}:v instanceof Date?{timestampValue:v.toISOString()}:{stringValue:String(v)};
const dec=f=>'booleanValue' in f?f.booleanValue:'timestampValue' in f?new Date(f.timestampValue):'nullValue' in f?null:f.stringValue;
const fields=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,enc(v)]));
const unpack=d=>({id:d.name.split('/').pop(),...Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,dec(v)]))});
async function api(path,method='GET',body){
  if(Date.now()>S.exp)await refresh();
  const r=await fetch(BASE+path,{method,headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||JSON.stringify(j));return j;}
const add=async(col,data)=>unpack(await api('/'+col,'POST',{fields:fields(data)}));
const update=(path,data)=>api('/'+path+'?'+Object.keys(data).map(k=>'updateMask.fieldPaths='+k).join('&'),'PATCH',{fields:fields(data)});
async function find(col,filters,order,parent=''){
  const q={from:[{collectionId:col}]};
  if(filters.length)q.where={compositeFilter:{op:'AND',filters:filters.map(([f,v])=>({fieldFilter:{field:{fieldPath:f},op:'EQUAL',value:enc(v)}}))}};
  if(order)q.orderBy=[{field:{fieldPath:order},direction:'ASCENDING'}];
  return (await api(parent+':runQuery','POST',{structuredQuery:q})).filter(x=>x.document).map(x=>unpack(x.document));}

// ---------- Navegação ----------
const stack=[];
function go(view,arg,push=true){clearInterval(timer);if(push)stack.push([view,arg]);back.hidden=stack.length<=1;out.hidden=!(S&&view===Home);scrollTo(0,0);view(arg);}
back.onclick=()=>{stack.pop();const [v,a]=stack[stack.length-1]||[Home];go(v,a,false);};
out.onclick=()=>{if(confirm('Sair da conta?')){S=null;store.set(null);stack.length=0;go(Auth,'signin');}};

// ---------- Telas ----------
function Auth(mode='signin'){
  stack.length=0;back.hidden=true;out.hidden=true;
  const title={signin:'Entrar',signup:'Criar conta',reset:'Recuperar senha'}[mode];
  m.innerHTML=`<img class="logo-big" src="logo.svg" alt=""><h2 style="text-align:center;font-size:24px">${title}</h2>
  <form id="f"><input id="e" type="email" placeholder="E-mail" autocomplete="email" autocapitalize="off" required>
  ${mode!=='reset'?`<input id="p" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="${mode==='signup'?'new-password':'current-password'}" required>`:''}
  <button class="btn" id="go">${title}</button></form>
  ${mode!=='signin'?'<button class="link" data-m="signin">Já tenho conta: entrar</button>':''}
  ${mode!=='signup'?'<button class="link" data-m="signup">Não tenho conta: criar</button>':''}
  ${mode==='signin'?'<button class="link" data-m="reset">Esqueci minha senha</button>':''}
  ${installTip()}`;
  m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>Auth(b.dataset.m));
  $('#f').onsubmit=async e=>{e.preventDefault();const email=$('#e').value.trim().toLowerCase(),btn=$('#go');btn.disabled=true;btn.textContent='Aguarde...';
    try{
      if(mode==='reset'){const r=await post(ID+'sendOobCode?key='+KEY,{requestType:'PASSWORD_RESET',email});if(r.error)throw new Error(msg(r));alert('Se este e-mail tiver conta, você vai receber um link para criar uma nova senha. Confira também o spam.');return Auth('signin');}
      const r=await post(ID+(mode==='signin'?'signInWithPassword':'signUp')+'?key='+KEY,{email,password:$('#p').value,returnSecureToken:true});
      if(!r.idToken)throw new Error(msg(r));save(r,email);go(Home);
    }catch(err){alert(err.message);btn.disabled=false;btn.textContent=title;}};
}
function installTip(){
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return'';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="warn" style="margin-top:24px">📲 <b>Instale o AutoLink na tela inicial:</b><br>${ios?'No Safari, toque em <b>Compartilhar</b> (quadrado com seta ↑) e depois em <b>"Adicionar à Tela de Início"</b>.':'No Chrome, toque nos <b>3 pontinhos ⋮</b> e depois em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.'}</div>`;
}

function Home(){
  m.innerHTML=`<h2>Meus carros</h2><div id="cars"><p class="muted">Carregando...</p></div>
  <h2>Adicionar carro</h2><form id="f"><input id="n" placeholder="Nome (ex: Onix prata)" required maxlength="40">
  <input id="pl" placeholder="Placa (opcional) ex: ABC1D23" maxlength="7" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off">
  <button class="btn">Adicionar</button></form>${installTip()}`;
  const pl=$('#pl');pl.oninput=()=>pl.value=pl.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const list=async()=>{const cars=await find('cars',[['ownerId',S.uid]]);const box=$('#cars');if(!box)return;
    box.innerHTML=cars.length?'':'<p class="muted">Nenhum carro ainda. Adicione abaixo.</p>';
    for(const c of cars){const b=document.createElement('button');b.className='card';
      b.innerHTML=`<b>${esc(c.name)}</b><div class="muted">${esc(c.plate||'')} ${c.active?'':'· pausado'} ${c.stickerCode?'· adesivo '+esc(c.stickerCode):'· sem adesivo'}</div>`;
      b.onclick=()=>go(Car,c);box.appendChild(b);}};
  poll(()=>list().catch(()=>{}),10000);
  const fab=document.createElement('button');fab.className='fab';fab.setAttribute('aria-label','Escanear QR code');
  fab.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10"/></svg>';
  fab.onclick=startScan;m.appendChild(fab);const fl=document.createElement('div');fl.className='fabl';fl.textContent='Escanear';m.appendChild(fl);
  $('#f').onsubmit=async e=>{e.preventDefault();const bt=$('#f .btn');if(bt.disabled)return;bt.disabled=true;bt.textContent='Adicionando...';
    try{const c=await add('cars',{ownerId:S.uid,name:$('#n').value.trim(),plate:pl.value,active:true,createdAt:new Date()});go(Car,c);}
    catch(err){alert('Erro: '+err.message);bt.disabled=false;bt.textContent='Adicionar';}};
}

function Car(car){
  m.innerHTML=`<h2>${esc(car.name)}</h2><div id="st"></div>
  <div class="row"><span>QR ativo (recebendo mensagens)</span><label class="sw"><input type="checkbox" id="act" ${car.active?'checked':''}><span></span></label></div>
  <h2>Conversas</h2><div id="chats"><p class="muted">Carregando...</p></div>
  <button class="link" id="del" style="color:#d32f2f;margin-top:30px">Apagar este carro</button>`;
  $('#del').onclick=async()=>{
    if(!confirm(`Apagar o carro "${car.name}"?`+(car.stickerCode?`\n\nO adesivo ${car.stickerCode} será desvinculado e poderá ser ativado de novo (com o PIN) em outro carro.`:'')+'\n\nNão dá para desfazer.'))return;
    try{
      if(car.stickerCode)await api('/stickers/'+car.stickerCode+'?updateMask.fieldPaths=carId&updateMask.fieldPaths=ownerId&updateMask.fieldPaths=activatedAt&updateMask.fieldPaths=activationPin','PATCH',{fields:{carId:{nullValue:null},ownerId:{nullValue:null},activatedAt:{nullValue:null},activationPin:{nullValue:null}}});
      await api('/cars/'+car.id,'DELETE');
      stack.length=0;go(Home);
    }catch(err){alert('Erro ao apagar: '+err.message);}};
  $('#act').onchange=async e=>{car.active=e.target.checked;try{await update('cars/'+car.id,{active:car.active});}catch(err){alert(err.message);}};
  const st=$('#st');
  if(car.stickerCode){st.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Adesivo ativo</div><div class="code">${esc(car.stickerCode)}</div></div>`;}
  else{st.innerHTML=`<div class="card"><b>Ativar adesivo AutoLink</b><p class="muted">Use o cartão de ativação que veio com o adesivo: código (ex: AL-7K3P9X) e PIN de 6 números.</p>
    <form id="sf"><input id="sc" placeholder="AL-XXXXXX" maxlength="9" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off">
    <input id="sp" placeholder="PIN (6 números)" inputmode="numeric" maxlength="6" type="password" autocomplete="off"><button class="btn">Ativar adesivo</button></form></div>`;
    $('#sc').oninput=e=>e.target.value=e.target.value.toUpperCase();
    $('#sp').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');
    $('#sf').onsubmit=async e=>{e.preventDefault();const c=$('#sc').value.trim(),p=$('#sp').value;
      if(!c||p.length!==6)return alert('Preencha o código e o PIN de 6 números.');
      let s;try{s=unpack(await api('/stickers/'+c));}catch(err){return alert('Código não encontrado. Confira o código impresso no adesivo.');}
      if(s.carId)return alert('Este adesivo já está vinculado a um carro.');
      try{await update('stickers/'+c,{carId:car.id,ownerId:S.uid,activatedAt:new Date(),activationPin:p});}catch(err){return alert('PIN incorreto. Confira o PIN no cartão de ativação.');}
      await update('cars/'+car.id,{stickerCode:c});car.stickerCode=c;alert('Adesivo ativado! ✅ Quem escanear o adesivo agora fala com você.');go(Car,car,false);};}
  const list=async()=>{const chats=(await find('chats',[['carId',car.id],['ownerId',S.uid]])).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    const box=$('#chats');if(!box)return;box.innerHTML=chats.length?'':'<p class="muted">Nenhuma mensagem ainda.</p>';
    for(const c of chats){const b=document.createElement('button');b.className='card';
      b.innerHTML=`<div>${c.blocked?'🚫 ':''}${esc(c.lastMsg)}</div><div class="muted">${c.updatedAt?c.updatedAt.toLocaleString('pt-BR'):''}</div>`;
      b.onclick=()=>go(Chat,{car,chatId:c.id});box.appendChild(b);}};
  poll(()=>list().catch(()=>{}));
}

function Chat({car,chatId}){
  let chat=null;
  m.innerHTML=`<div class="row"><h2 style="margin:0">${esc(car.name)}</h2><div id="acts"></div></div><div id="bl"></div><div id="msgs"></div>
  <div class="composer"><div class="q">${['Já estou indo!','Me dá 5 minutos','Obrigado pelo aviso!'].map(q=>`<button class="chip">${q}</button>`).join('')}</div>
  <form class="in" id="f"><input id="t" placeholder="Responder..." maxlength="500" autocomplete="off"><button class="btn">Enviar</button></form></div>`;
  const box=$('#msgs');let last='';
  const load=async()=>{
    chat=unpack(await api('/chats/'+chatId));
    $('#acts').innerHTML=chat.blocked?'':'<button class="chip" id="bk">🚫 Bloquear</button> <button class="chip" id="rp">⚠️ Denunciar</button>';
    $('#bl').innerHTML=chat.blocked?'<p class="muted err">Pessoa bloqueada. Ela não consegue mais te mandar mensagens.</p>':'';
    if(!chat.blocked){$('#bk').onclick=()=>confirm('Bloquear? Essa pessoa não vai mais conseguir te mandar mensagens.')&&block();$('#rp').onclick=report;}
    const ms=await find('messages',[],'at','/chats/'+chatId);
    const html=ms.map(x=>`<div class="b ${x.from==='owner'?'me':'them'}">${esc(x.text)}</div>`).join('');
    if(html!==last){last=html;box.innerHTML=html;scrollTo(0,document.body.scrollHeight);}};
  const block=async(silent)=>{try{await update('chats/'+chatId,{blocked:true});
    await api('/owners/'+S.uid+'/blocked/'+chat.visitorId+'?updateMask.fieldPaths=at','PATCH',{fields:fields({at:new Date()})});
    if(!silent)alert('Bloqueado. Essa pessoa não consegue mais te mandar mensagens.');load();}catch(err){alert('Erro: '+err.message);}};
  const report=async()=>{const r=prompt('Denunciar: qual o problema?\n1 = Ofensa ou ameaça\n2 = Spam / mensagens repetidas\n3 = Outro\n\nDigite 1, 2 ou 3:');
    const reason={1:'ofensa',2:'spam',3:'outro'}[String(r||'').trim()];if(!reason)return;
    try{await add('reports',{ownerId:S.uid,carId:car.id,chatId,visitorId:chat.visitorId,reason,at:new Date()});await block(true);alert('Denúncia enviada. A pessoa também foi bloqueada.');}catch(err){alert('Erro: '+err.message);}};
  const send=async t=>{t=t.trim();if(!t)return;$('#t').value='';
    try{await add('chats/'+chatId+'/messages',{text:t,from:'owner',at:new Date()});await update('chats/'+chatId,{lastMsg:'Você: '+t,updatedAt:new Date()});load();}catch(err){alert('Erro: '+err.message);}};
  $('#f').onsubmit=e=>{e.preventDefault();send($('#t').value);};
  m.querySelectorAll('.q .chip').forEach(b=>b.onclick=()=>send(b.textContent));
  poll(()=>load().catch(()=>{}));
}

// ---------- Leitor de QR ----------
let stream=null,scanning=false;
async function startScan(){
  const box=document.getElementById('scan'),v=box.querySelector('video'),tx=document.getElementById('scanTx');
  tx.textContent='Aponte para o QR code do adesivo AutoLink';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});}
  catch(e){return alert('Não foi possível abrir a câmera. Permita o acesso à câmera para o AutoLink nos ajustes do celular.');}
  box.style.display='block';v.srcObject=stream;await v.play().catch(()=>{});scanning=true;
  const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(!scanning)return;
    if(v.readyState>=2&&window.jsQR){const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,640/Math.max(w,h));c.width=w*k;c.height=h*k;ctx.drawImage(v,0,0,c.width,c.height);
      const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
      if(r&&r.data){const u=handleQR(r.data);if(u){stopScan();location.href=u;return;}tx.textContent='Esse QR code não é de um adesivo AutoLink.';}}
    requestAnimationFrame(tick);};
  tick();}
function stopScan(){scanning=false;document.getElementById('scan').style.display='none';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
document.getElementById('scanX').onclick=stopScan;
function handleQR(text){try{const u=new URL(text);const here=new URL('./',location.href);
  if(u.origin===here.origin&&u.pathname.startsWith(here.pathname)&&(u.searchParams.get('s')||u.searchParams.get('c'))){
    const q=u.searchParams.get('s')?'s='+encodeURIComponent(u.searchParams.get('s')):'c='+encodeURIComponent(u.searchParams.get('c'));return 'index.html?'+q+'&from=app';}}catch(e){}return null;}
