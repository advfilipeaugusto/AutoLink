<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adesivo AutoLink</title><link rel="icon" href="logo.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;background:#ddd;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.st{width:320px;background:#111;border-radius:28px;padding:22px 22px 18px;color:#fff;text-align:center;box-shadow:0 6px 24px #0004;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;font-weight:900;letter-spacing:-1px}
.brand img{width:44px;height:44px;border-radius:11px}.brand span{color:#FF6B00}
.t{font-size:19px;font-weight:800;margin:14px 0 4px;line-height:1.2}.t b{color:#FF6B00}
.qr{background:#fff;border:6px solid #FF6B00;border-radius:20px;padding:14px;display:inline-block;margin:10px 0 4px}
.car{width:100%;margin-top:6px}.f{font-size:13px;color:#bbb;margin-top:4px}.f b{color:#FF6B00}
.btn{margin-top:20px;background:#FF6B00;color:#111;border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:800}
.dica{max-width:320px;color:#333;font-size:14px;text-align:center}
@media print{body{background:#fff}.btn,.dica{display:none}.st{box-shadow:none}}
</style></head><body>
<div class="st">
  <div class="brand"><img src="logo.svg" alt=""><div>Auto<span>Link</span></div></div>
  <div class="t">Precisa falar com o<br><b>dono deste carro?</b></div>
  <div class="qr"><div id="qr"></div></div>
  <div class="t" style="font-size:16px;margin-top:6px">Aponte a câmera do celular</div>
  <svg class="car" viewBox="0 0 400 96">
<ellipse cx="200" cy="88" rx="170" ry="5" fill="#000" opacity=".5"/>
<path d="M34 74C26 74 24 68 24 62L26 50C28 44 34 42 42 41L100 35C124 18 152 9 184 9L222 9C252 9 274 18 296 33L342 40C362 43 374 50 376 60L376 66C376 71 372 74 366 74Z" fill="#FF6B00"/>
<path d="M114 36C134 22 156 15 182 15L201 15L201 36Z M209 36L209 15L222 15C246 15 266 22 284 35Z" fill="#111"/><path d="M30 41L58 37L54 33L30 36Z" fill="#111"/>
<path d="M44 54h330" stroke="#C45200" stroke-width="2" fill="none"/>
<path d="M205 36v32" stroke="#C45200" stroke-width="2"/>
<rect x="218" y="44" width="14" height="4" rx="2" fill="#111"/>
<path d="M350 43l16 3c5 1 8 5 9 9h-22z" fill="#FFF3C4"/>
<path d="M25 47h11v9H24z" fill="#E00"/>
<g><circle cx="110" cy="70" r="22" fill="#111"/><circle cx="110" cy="70" r="15" fill="#2a2a2a"/><circle cx="110" cy="70" r="13" fill="none" stroke="#FF6B00" stroke-width="2"/><g stroke="#FF6B00" stroke-width="3"><path d="M110 58v24M98 70h24M101.5 61.5l17 17M118.5 61.5l-17 17"/></g><circle cx="110" cy="70" r="4" fill="#111"/></g>
<g><circle cx="300" cy="70" r="22" fill="#111"/><circle cx="300" cy="70" r="15" fill="#2a2a2a"/><circle cx="300" cy="70" r="13" fill="none" stroke="#FF6B00" stroke-width="2"/><g stroke="#FF6B00" stroke-width="3"><path d="M300 58v24M288 70h24M291.5 61.5l17 17M308.5 61.5l-17 17"/></g><circle cx="300" cy="70" r="4" fill="#111"/></g>
</svg>
  <div class="f">Sem baixar app · <b>100% anônimo</b></div>
</div>
<button class="btn" onclick="print()">Imprimir / salvar PDF</button>
<p class="dica">Dica: imprima em <b>papel adesivo vinil</b> ou leve o PDF numa gráfica. Tamanho sugerido: 8 × 12 cm. Cole por dentro do vidro.</p>
<script>
const c=new URLSearchParams(location.search).get('c');
if(!c){document.querySelector('.st').innerHTML='<p>Abra o adesivo pelo app AutoLink.</p>';}
else new QRCode(document.getElementById('qr'),{text:location.origin+location.pathname.replace('adesivo.html','')+'?c='+c,width:200,height:200,colorDark:'#111',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});
</script></body></html>
