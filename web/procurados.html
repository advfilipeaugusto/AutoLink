<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veículos procurados · AutoLink</title>
<link rel="icon" href="icon3-192.png">
<style>
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f4f4f6;color:#111}
header{background:#111;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
header img{height:30px}header span{color:#FF6B00}header a{color:#FF6B00;text-decoration:none;font-size:22px;margin-right:4px}
main{max-width:560px;margin:0 auto;padding:16px}
.warn{background:#fee2e2;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.big{display:block;text-align:center;background:#ef4444;color:#fff;font-weight:800;padding:14px;border-radius:12px;text-decoration:none;margin:12px 0}
.c{background:#fff;border-radius:16px;overflow:hidden;margin:12px 0;box-shadow:0 1px 3px #0001}
.c img{width:100%;height:190px;object-fit:cover;display:block;background:#ddd}
.c .b{padding:12px 14px}.pl{font-family:monospace;font-weight:900;font-size:18px;letter-spacing:2px;background:#fff;border:2px solid #111;border-radius:6px;padding:1px 8px;display:inline-block}
.m{color:#666;font-size:13px}.ft{background:#FF6B00;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px}
.row{display:flex;gap:8px;margin-top:10px}.row a{flex:1;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:800;font-size:14px}
</style>
</head>
<body>
<header><a href="app.html" aria-label="Voltar">‹</a><img src="logo-car-white.png" alt="">Veículos <span>procurados</span></header>
<main>
<div class="warn"><b>Viu algum destes carros?</b> Não se aproxime e não aborde ninguém. Ligue <b>190</b> e avise a AutoLink pelo botão abaixo. Pode ser anônimo.</div>
<a class="big" href="achei.html">Achei um carro roubado</a>
<div id="out"><p class="m">Carregando...</p></div>
</main>
<script>
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I',BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=f=>'booleanValue' in f?f.booleanValue:'timestampValue' in f?new Date(f.timestampValue):'integerValue' in f?+f.integerValue:f.stringValue;
const out=document.getElementById('out');
(async()=>{try{
  const r=await fetch(BASE+':runQuery?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'thefts'}],where:{fieldFilter:{field:{fieldPath:'status'},op:'EQUAL',value:{stringValue:'approved'}}}}})});
  const l=(await r.json()).filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),...Object.fromEntries(Object.entries(x.document.fields||{}).map(([k,v])=>[k,dec(v)]))})).filter(t=>!t.deleted)
    .sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||(b.createdAt||0)-(a.createdAt||0));
  out.innerHTML=l.length?l.map(t=>`<div class="c">${t.photo?`<img src="${t.photo}" alt="Foto do carro">`:''}<div class="b">
    <b style="font-size:17px">${esc(t.carName||'Carro')}</b>${t.featured?'<span class="ft">DESTAQUE</span>':''}<div style="margin:6px 0"><span class="pl">${esc(t.plate||'—')}</span> <span class="m">${esc(t.color||'')} ${esc(t.year||'')}</span></div>
    <div class="m">${t.kind==='furto'?'Furtado':'Roubado'} ${t.when?'em '+esc(t.when):''} · ${esc(t.place||'')} ${esc(t.city||'')}${t.uf?'/'+esc(t.uf):''}</div>
    ${t.desc?`<div style="margin-top:8px;font-size:14px;line-height:1.45"><b>Mensagem do dono:</b> ${esc(t.desc)}</div>`:''}
    <div class="row"><a href="achei.html?plate=${encodeURIComponent(t.plate||'')}" style="background:#ef4444;color:#fff">Vi este carro</a><a href="carro.html?id=${t.id}" style="background:#111;color:#fff">Ver detalhes</a></div></div></div>`).join(''):'<p class="m">Nenhum veículo procurado no momento.</p>';
}catch(e){out.innerHTML='<p class="m">Não foi possível carregar agora. Tente de novo.</p>';}})();
</script>
</body>
</html>
