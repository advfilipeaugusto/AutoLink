<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Link</title><link rel="icon" href="logo.svg"><link rel="apple-touch-icon" href="logo.svg"><meta name="theme-color" content="#111111"><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f5;color:#111}header{background:#111;color:#fff;padding:12px 16px;font-size:22px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}header img{width:36px;height:36px;border-radius:9px}header span{color:#FF6B00}
main{padding:16px;max-width:520px;margin:auto}.q{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid #111;border-radius:12px;background:#fff;color:#111;font-size:16px;font-weight:600;text-align:left}.q:active{background:#FF6B00}
#msgs{min-height:200px}.b{padding:10px;border-radius:12px;margin:4px 0;max-width:80%}.me{background:#FF6B00;color:#111;margin-left:auto}.them{background:#111;color:#fff}
form{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:16px}button.s{background:#FF6B00;color:#111;border:0;border-radius:8px;padding:0 16px;font-weight:700}
.muted{color:#777;font-size:13px}</style></head><body><header><img src="logo.svg" alt=""><div>Auto<span>Link</span></div></header><main id="app">Carregando...</main>
<script>
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I', BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents';
const app=document.getElementById('app'), carId=new URLSearchParams(location.search).get('c');
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const enc=v=>typeof v==='boolean'?{booleanValue:v}:v instanceof Date?{timestampValue:v.toISOString()}:{stringValue:String(v)};
const dec=f=>'booleanValue' in f?f.booleanValue:'timestampValue' in f?new Date(f.timestampValue):f.stringValue;
const fields=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,enc(v)]));
const unpack=d=>({id:d.name.split('/').pop(),...Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,dec(v)]))});
let S=null;
async function login(){
  const saved=JSON.parse(localStorage.getItem('al_session')||'null'); let r;
  if(saved){ r=await (await fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+saved.refresh})).json();
    if(r.id_token) S={uid:r.user_id,token:r.id_token,refresh:r.refresh_token}; }
  if(!S){ r=await (await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'})).json();
    if(!r.idToken) throw new Error('login: '+JSON.stringify(r.error||r)); S={uid:r.localId,token:r.idToken,refresh:r.refreshToken}; }
  S.exp=Date.now()+50*60e3; localStorage.setItem('al_session',JSON.stringify(S));
}
async function api(path,method='GET',body){
  if(Date.now()>S.exp){S=null;await login();}
  const r=await fetch(BASE+path,{method,headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.error?.message||JSON.stringify(j)); return j;
}
const quick=['🚗 Seu carro está bloqueando minha garagem','💡 O farol está aceso','🪟 O vidro está aberto','🚨 O alarme está disparando','🛞 O pneu está furado/murcho','⚠️ Vão rebocar / multar seu carro'];
let car, chatId, timer;
async function send(text){
  try{
    const now=new Date();
    if(!chatId){
      const c=unpack(await api('/chats','POST',{fields:fields({carId,ownerId:car.ownerId,visitorId:S.uid,lastMsg:text,updatedAt:now})}));
      chatId=c.id; localStorage.setItem('chat_'+carId,chatId); showChat();
    } else await api('/chats/'+chatId+'?updateMask.fieldPaths=lastMsg&updateMask.fieldPaths=updatedAt','PATCH',{fields:fields({lastMsg:text,updatedAt:now})});
    await api('/chats/'+chatId+'/messages','POST',{fields:fields({text,from:'visitor',at:now})});
    if(car.notifyTopic) fetch('https://ntfy.sh/'+car.notifyTopic,{method:'POST',headers:{Title:'AutoLink',Tags:'car',Priority:'high'},body:'Nova mensagem sobre o '+car.name}).catch(()=>{});
    load();
  }catch(e){ alert(/permission|PERMISSION/.test(e.message)?'O dono deste carro não está recebendo mensagens suas.':'Não foi possível enviar: '+e.message); }
}
async function load(){
  const box=document.getElementById('msgs'); if(!box) return;
  const res=await api('/chats/'+chatId+':runQuery','POST',{structuredQuery:{from:[{collectionId:'messages'}],orderBy:[{field:{fieldPath:'at'},direction:'ASCENDING'}]}});
  const html=res.filter(x=>x.document).map(x=>{const m=unpack(x.document);return `<div class="b ${m.from==='visitor'?'me':'them'}">${esc(m.text)}</div>`}).join('');
  if(box.innerHTML!==html){box.innerHTML=html;scrollTo(0,document.body.scrollHeight);}
}
function form(){ document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=document.getElementById('t');const v=t.value.trim();if(v){send(v);t.value='';}}; }
function showChat(){
  app.innerHTML=`<p class="muted">Conversa anônima com o dono do carro <b>${esc(car.name)}</b>. As respostas aparecem aqui.</p><div id="msgs"></div>
  <form id="f"><input id="t" placeholder="Escreva uma mensagem..." maxlength="500"><button class="s">Enviar</button></form>`;
  form(); clearInterval(timer); timer=setInterval(()=>load().catch(()=>{}),3000);
}
(async()=>{
  try{
    await login();
    car=carId&&unpack(await api('/cars/'+carId));
  }catch(e){ car=null; }
  if(!car||!car.active){app.innerHTML='<p>Este QR code não está ativo.</p>';return;}
  chatId=localStorage.getItem('chat_'+carId);
  if(chatId){showChat();load().catch(()=>{});return;}
  app.innerHTML=`<p>Avise o dono do <b>${esc(car.name)}</b>. Ele recebe na hora e você não precisa se identificar.</p>`+
    quick.map(q=>`<button class="q">${q}</button>`).join('')+`<p class="muted">Ou escreva:</p><form id="f"><input id="t" maxlength="500"><button class="s">Enviar</button></form>`;
  app.querySelectorAll('.q').forEach(b=>b.onclick=()=>send(b.textContent)); form();
})();
</script></body></html>
