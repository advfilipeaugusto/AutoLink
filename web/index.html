<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Link</title><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin><link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin><link rel="icon" href="icon3-192.png"><link rel="apple-touch-icon" href="icon3-180.png"><meta name="theme-color" content="#111111"><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f5;color:#111}header{background:#111;color:#fff;padding:12px 16px;font-size:22px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}header img{width:36px;height:36px;border-radius:9px}header span{color:#FF6B00}
main{padding:16px;max-width:520px;margin:auto}.q{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid #111;border-radius:12px;background:#fff;color:#111;font-size:16px;font-weight:600;text-align:left}.q:active{background:#FF6B00}
#msgs{min-height:200px}.b{padding:10px;border-radius:12px;margin:4px 0;max-width:80%}.me{background:#FF6B00;color:#111;margin-left:auto}.them{background:#111;color:#fff}
form{display:flex;gap:8px}input{flex:1;padding:12px;border-radius:8px;border:1px solid #ddd;font-size:16px}button.s{background:#FF6B00;color:#111;border:0;border-radius:8px;padding:0 16px;font-weight:700}
.muted{color:#777;font-size:13px}.nm{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px 12px;margin:0 0 6px}.acc{display:block;width:100%;margin:18px 0 4px;padding:14px;border:2px solid #ef4444;border-radius:12px;background:#fff;color:#b91c1c;font-size:15px;font-weight:700}
@keyframes pulse{50%{opacity:.85}}
.okb{background:#e8f8ee;border:1px solid #22c55e;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.45}.tk{font-size:11px;text-align:right;margin-top:3px;opacity:.85}.seen{text-align:right;font-size:12px;color:#1a7f37;margin:-2px 2px 6px}</style></head><body><header><a id="bk" href="app.html" hidden aria-label="Voltar" style="color:#FF6B00;text-decoration:none;font-size:34px;line-height:1;font-weight:400;margin-right:6px">‹</a><img src="logo-car-white.png" alt="" style="width:auto;height:26px;border-radius:0"><div>Auto<span>Link</span></div></header><main id="app">Carregando...</main>
<script src="filter.js"></script>
<script>
if(new URLSearchParams(location.search).get('from')==='app'||navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.getElementById('bk').hidden=false;
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I', BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents';
const app=document.getElementById('app'), qs=new URLSearchParams(location.search), stickerCode=(qs.get('s')||'').toUpperCase(); let carId=qs.get('c');
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const enc=v=>typeof v==='boolean'?{booleanValue:v}:v instanceof Date?{timestampValue:v.toISOString()}:{stringValue:String(v)};
const dec=f=>'integerValue' in f?+f.integerValue:'booleanValue' in f?f.booleanValue:'timestampValue' in f?new Date(f.timestampValue):f.stringValue;
const fields=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,enc(v)]));
const unpack=d=>({id:d.name.split('/').pop(),...Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,dec(v)]))});
let S=null;
let VER=false,VERP=Promise.resolve(),CK='chat_',CH={};
// leitura pública (sem login) do adesivo e do carro: abre mais rápido
async function pub(path){const r=await fetch(BASE+path+'?key='+KEY);if(!r.ok)throw new Error('x');return unpack(await r.json());}
async function login(){
  let r;
  // Usuário do app AutoLink com cadastro: entra identificado
  const own=JSON.parse(localStorage.getItem('al_owner')||'null');
  if(own){ r=await (await fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+own.refresh})).json();
    if(r.id_token){ S={uid:r.user_id,token:r.id_token,refresh:r.refresh_token,exp:Date.now()+50*60e3,own:1};
      CK='chatv_';VERP=api('/profiles/'+S.uid).then(()=>{VER=true;}).catch(()=>{VER=false;});return; } }
  const saved=JSON.parse(localStorage.getItem('al_session')||'null');
  if(saved){ r=await (await fetch('https://securetoken.googleapis.com/v1/token?key='+KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+saved.refresh})).json();
    if(r.id_token) S={uid:r.user_id,token:r.id_token,refresh:r.refresh_token}; }
  if(!S){ r=await (await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'})).json();
    if(!r.idToken) throw new Error('login: '+JSON.stringify(r.error||r)); S={uid:r.localId,token:r.idToken,refresh:r.refreshToken}; }
  S.exp=Date.now()+50*60e3; localStorage.setItem('al_session',JSON.stringify(S));
}
async function api(path,method='GET',body){
  if(Date.now()>S.exp){S=null;VER=false;CK='chat_';await login();}
  const r=await fetch(BASE+path,{method,headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error(j.error?.message||JSON.stringify(j)); return j;
}
const quickApp=['🎒 Esqueci um objeto no seu carro','📱 Esqueci meu celular no seu carro','⭐ Obrigado pela corrida!'];
const quick=['🚗 Seu carro está bloqueando minha garagem','💡 O farol está aceso','🪟 O vidro está aberto','🚨 O alarme está disparando','🛞 O pneu está furado/murcho','⚠️ Vão rebocar / multar seu carro'];
let car, chatId, timer;
async function send(text){
  await VERP;const bad=alCheck(text+' '+vName(),!!CH.repliedAt);
  if(bad){alert(alBlockedMsg(bad));try{await api('/blockedMsgs','POST',{fields:fields({by:S.uid,byVerified:VER?'sim':'não',ownerId:car.ownerId,carId,carName:car.name,text,reason:bad,from:'visitor',at:new Date()})});}catch(e){}return;}
  try{
    const now=new Date();
    if(!chatId){
      let c;try{c=unpack(await api('/chats','POST',{fields:fields(Object.assign({carId,ownerId:car.ownerId,visitorId:S.uid,lastMsg:text,updatedAt:now,createdAt:now},VER?{visitorVerified:true}:{},vName()?{visitorName:vName()}:{}))}));}
      catch(e){if(/permission|PERMISSION/.test(e.message))return alert(car.active===false?'Este QR code está pausado pelo dono.':'Não foi possível iniciar a conversa.\n\nO dono deste carro pode ter bloqueado este aparelho.');throw e;}
      window._justSent=1;
      chatId=c.id; localStorage.setItem(CK+carId,chatId); showChat();
    } else await api('/chats/'+chatId+'?updateMask.fieldPaths=lastMsg&updateMask.fieldPaths=updatedAt','PATCH',{fields:fields({lastMsg:text,updatedAt:now})});
    await api('/chats/'+chatId+'/messages','POST',{fields:fields({text,from:'visitor',at:now})});
    try{const h=JSON.parse(localStorage.getItem('al_hist')||'[]').filter(x=>x.carId!==carId);h.push({carId,chatId,carName:car.name,lastMsg:text,at:Date.now()});localStorage.setItem('al_hist',JSON.stringify(h.slice(-100)));}catch(e){}
    if(car.notifyTopic) fetch('https://ntfy.sh/'+car.notifyTopic,{method:'POST',headers:{Title:'AutoLink',Tags:'car',Priority:'high'},body:'Nova mensagem sobre o '+car.name}).catch(()=>{});
    load();
  }catch(e){ if(/permission|PERMISSION/.test(e.message)){let ch={};try{ch=unpack(await api('/chats/'+chatId));}catch(x){} alert(ch.blocked?'O dono deste carro não está recebendo mensagens suas.':!alChatOpen(ch)&&ch.updatedAt?'Seu tempo para escrever nesta conversa acabou.':'Não foi possível enviar agora. Feche e abra a página e tente de novo.\n\n(código: permissão)');} else alert('Não foi possível enviar: '+e.message); }
}
async function load(){
  const box=document.getElementById('msgs'); if(!box) return;
  try{car=unpack(await api('/cars/'+carId));}catch(e){}awayBanner();
  const res=await api('/chats/'+chatId+':runQuery','POST',{structuredQuery:{from:[{collectionId:'messages'}],orderBy:[{field:{fieldPath:'at'},direction:'ASCENDING'}]}});
  const ms=res.filter(x=>x.document).map(x=>unpack(x.document));
  let ch={};try{ch=unpack(await api('/chats/'+chatId));}catch(e){}CH=ch;
  const tb=document.getElementById('ttl');
  if(ch.updatedAt&&!alChatOpen(ch)){const f=document.getElementById('f');if(f)f.outerHTML='<div style="background:#f2f2f2;border-radius:12px;padding:12px;text-align:center;font-size:14px">⏱️ <b>Seu tempo para escrever acabou.</b><br>Você não pode mais enviar mensagens nesta conversa. O dono do carro continua vendo suas mensagens e ainda pode te responder aqui.<br><button class="s" style="margin-top:8px;padding:10px 14px" onclick="localStorage.removeItem(CK+carId);location.reload()">Começar nova conversa</button></div>';if(tb)tb.remove();}
  else if(tb)tb.innerHTML=(ch.repliedAt?'💬 O dono respondeu! Agora vocês podem conversar por 2 horas e trocar telefone, se quiserem.<br>':'')+`⏳ Você ainda pode escrever por <b>${alLeftTxt(ch)}</b>.`;
  const lastV=[...ms].reverse().find(m=>m.from==='visitor');
  const seen=m=>ch.seenAt&&+ch.seenAt>=+m.at;
  let html=ms.map(m=>m.from==='visitor'
    ?`<div class="b me">${esc(m.text)}<div class="tk">${m.at?m.at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''} <b style="color:${seen(m)?'#0b5cff':'#555'}">${seen(m)?'✓✓':'✓'}</b></div></div>`
    :`<div class="b them">${esc(m.text)}<div class="tk" style="color:#aaa">${m.at?m.at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`).join('');
  if(lastV)html+=seen(lastV)?'<div class="seen">✓✓ Visto pelo dono</div>':'<div class="seen" style="color:#777">✓ Enviado · aguardando o dono ver</div>';
  if(lastV&&car.awayText&&car.awayUntil&&+car.awayUntil>Date.now()&&!ms.some(m=>m.from==='owner'&&+m.at>+lastV.at))
    html+=`<div class="b them" style="background:#333">🤖 <b>Resposta automática</b><br>${esc(car.awayText)}<br><small style="opacity:.7">até ${car.awayUntil.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div>`;
  if(box.innerHTML!==html){box.innerHTML=html;scrollTo(0,document.body.scrollHeight);}
}
function awayBanner(){let b=document.getElementById('awb');const on=car&&car.awayText&&car.awayUntil&&+car.awayUntil>Date.now();
  if(!on){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='awb';app.prepend(b);}
  b.innerHTML=`<div style="background:#111;color:#fff;border-left:5px solid #FF6B00;border-radius:12px;padding:12px 14px;margin-bottom:12px">🤖 <b>O dono está ausente</b><br>${esc(car.awayText)}<br><small style="opacity:.75">Até ${car.awayUntil.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}. Você ainda pode mandar mensagem.</small></div>`;}
function form(){ document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=document.getElementById('t');const v=t.value.trim();if(v){send(v);t.value='';}}; }
function showChat(){
  app.innerHTML=`<div class="okb">✅ <b>Sua mensagem foi enviada!</b><br>O dono do <b>${esc(car.name)}</b> foi avisado. Deixe esta página aberta: a resposta aparece aqui e você vê quando ele visualizar (✓✓).</div><div id="msgs"></div><p class="muted" id="ttl" style="text-align:center"></p>
  <form id="f"><input id="t" placeholder="Escreva uma mensagem..." maxlength="500"><button class="s">Enviar</button></form>`;
  form(); clearInterval(timer); timer=setInterval(()=>load().catch(()=>{}),3000);
}
(async()=>{
  try{
    const lg=login();
    if(stickerCode){
      let st=null; try{ st=await pub('/stickers/'+stickerCode); }catch(e){ await lg; try{ st=unpack(await api('/stickers/'+stickerCode)); }catch(x){} }
      if(!st||st.disabled){ app.innerHTML='<p>Este QR code não está ativo.</p>'; return; }
      if(!st.carId){ app.innerHTML=`<h2>Adesivo novo 🎉</h2><p>Este adesivo AutoLink ainda não foi ativado.</p><p><b>É seu?</b> Toque no botão abaixo, entre no app AutoLink, escolha o seu carro e digite o <b>PIN do cartão de ativação</b> que veio na embalagem.</p><a href="app.html?activate=${encodeURIComponent(stickerCode)}" style="display:block;text-align:center;background:#FF6B00;color:#111;font-weight:800;padding:14px;border-radius:12px;text-decoration:none">Ativar meu adesivo</a>`; return; }
      carId=st.carId;
    }
    try{ car=carId&&await pub('/cars/'+carId); }catch(e){ await lg; car=carId&&unpack(await api('/cars/'+carId)); }
    await lg;
  }catch(e){ car=null; }
  if(!car||!car.active){app.innerHTML='<p>Este QR code não está ativo.</p>';return;}
  if(car.stolen&&car.theftId){stolenView();return;}
  chatId=localStorage.getItem(CK+carId);
  if(chatId){
    showChat();load().catch(()=>{});return;}
  if(car.fleet)rateBox();
  app.innerHTML=(car.fleet?'<div id="rate"></div>':'')+`<p>Avise o dono do <b>${esc(car.name)}</b>. Ele recebe na hora.</p>
    <div class="nm"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="anon" checked style="width:20px;height:20px;flex:none"> Enviar como anônimo</label>
    <input id="vname" placeholder="Seu nome (opcional)" maxlength="40" style="display:none;width:100%;box-sizing:border-box;margin-top:8px"></div>`+
    (car.appDriver?quickApp:[]).concat(quick).map(q=>`<button class="q">${q}</button>`).join('')+`<p class="muted">Ou escreva:</p><p class="muted" style="margin-top:-6px">⏳ Você terá <b>20 minutos</b> para conversar a partir da primeira mensagem.</p><form id="f"><input id="t" maxlength="500"><button class="s">Enviar</button></form>`;
  app.insertAdjacentHTML('beforeend','<button class="acc" id="accB">🚑 Este carro sofreu um acidente?</button>');
  if(car.medUntil&&new Date(car.medUntil)>new Date())app.insertAdjacentHTML('afterbegin','<div style="background:#fee2e2;border:2px solid #ef4444;border-radius:14px;padding:12px;margin-bottom:12px"><b style="color:#b91c1c">🩺 Ficha médica liberada para a equipe de atendimento</b><div style="font-size:14px;margin:4px 0 8px">Você está socorrendo o motorista? Identifique-se para ver a ficha. Fica registrado.</div><button class="s" id="medOpenB" style="width:100%;background:#ef4444;color:#fff;padding:12px">Sou da equipe: ver ficha</button></div>');
  if(document.getElementById('medOpenB'))document.getElementById('medOpenB').onclick=medTeam;
  document.getElementById('anon').onchange=e=>{const n=document.getElementById('vname');n.style.display=e.target.checked?'none':'block';if(!e.target.checked)n.focus();};
  document.getElementById('accB').onclick=accidentChoice;
  app.querySelectorAll('.q').forEach(b=>b.onclick=()=>send(b.textContent)); form(); if(car.fleet)rateBox(); awayBanner();
})();
function stolenView(){
  app.innerHTML=`<div style="background:#dc2626;color:#fff;border-radius:16px;padding:18px;text-align:center;animation:pulse 1.2s infinite"><div style="font-size:40px">🚨</div><b style="font-size:22px">VEÍCULO ROUBADO</b><div style="margin-top:6px">Este carro (${esc(car.name)}) foi registrado como roubado ou furtado.</div></div>
   <div style="background:#fff;border:2px solid #111;border-radius:14px;padding:14px;margin:14px 0;font-size:15px;line-height:1.5"><b>⚠️ Para sua segurança:</b><br>• <b>Não se aproxime</b> nem aborde ninguém.<br>• Ligue para a <b>Polícia: 190</b>.<br>• Envie a localização abaixo: é <b>anônimo</b> e ajuda o dono a recuperar o carro.</div>
   <textarea id="sn" maxlength="300" placeholder="O que você viu? (opcional: rua, direção, pessoas...)" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;min-height:70px"></textarea>
   <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:600"><input type="checkbox" id="sid" style="width:20px;height:20px;flex:none"> Quero me identificar (opcional)</label>
   <div id="sidf" style="display:none"><input id="sidn" placeholder="Seu nome" maxlength="80" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;margin-top:8px"><input id="sidp" placeholder="Seu telefone com DDD" inputmode="tel" maxlength="20" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;margin-top:8px"><p style="font-size:13px;color:#555;margin:6px 0 0">Seu nome e telefone vão só para a equipe AutoLink, que repassa ao dono. Nunca aparecem na página pública.</p></div>
   <button class="s" id="ss" style="width:100%;padding:16px;font-size:17px;margin-top:8px;background:#dc2626;color:#fff">📍 Enviar localização</button>
   <a href="tel:190" style="display:block;text-align:center;margin-top:12px;padding:14px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:800">📞 Ligar 190</a>`;
  document.getElementById('sid').onchange=e=>{document.getElementById('sidf').style.display=e.target.checked?'block':'none';};
  document.getElementById('ss').onclick=e=>{const idOn=document.getElementById('sid').checked,wn=document.getElementById('sidn').value.trim(),wp=document.getElementById('sidp').value.replace(/\D/g,'');
    if(idOn&&(wn.length<3||wp.length<10))return alert('Para se identificar, preencha nome e telefone com DDD. Ou desmarque a opção para enviar anônimo.');
    const b=e.target;b.disabled=true;b.textContent='Obtendo localização...';
    const save=async(c)=>{try{await api('/thefts/'+car.theftId+'/sightings','POST',{fields:fields(Object.assign({by:S.uid,note:document.getElementById('sn').value.trim(),at:new Date()},c?{lat:String(c.latitude),lng:String(c.longitude)}:{}))});
      if(idOn)await api('/thefts/'+car.theftId+'/witnesses','POST',{fields:fields(Object.assign({by:S.uid,name:wn,phone:wp,note:document.getElementById('sn').value.trim(),at:new Date()},c?{lat:String(c.latitude),lng:String(c.longitude)}:{}))}).catch(()=>{});
      app.innerHTML='<div class="okb">✅ <b>Obrigado!</b> A informação foi enviada à equipe AutoLink e ao dono do carro'+(idOn?', com o seu contato':', de forma anônima')+'. Não se aproxime do veículo. Em caso de risco, ligue 190.</div>';}
      catch(err){alert('Não foi possível enviar: '+err.message);b.disabled=false;b.textContent='📍 Enviar localização';}};
    navigator.geolocation.getCurrentPosition(p=>save(p.coords),()=>{if(confirm('Não foi possível pegar a localização. Enviar só a mensagem?'))save(null);else{b.disabled=false;b.textContent='📍 Enviar localização';}},{enableHighAccuracy:true,timeout:15000});};
}
function vName(){const a=document.getElementById('anon'),n=document.getElementById('vname');return a&&!a.checked&&n?n.value.trim():'';}
function shrink(file){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,760/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.5));};img.onerror=no;img.src=URL.createObjectURL(file);});}
function accidentChoice(){
  app.innerHTML=`<h2>🚑 Acidente com o ${esc(car.name)}</h2>
   <p style="background:#fee2e2;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;font-size:14px">🚨 Se houver feridos, ligue <b>192 (SAMU)</b> ou <b>193 (Bombeiros)</b> antes de tudo.</p>
   <p>Como você quer ajudar?</p>
   <button class="s" id="chF" style="width:100%;text-align:left;padding:16px;background:#FF6B00;color:#fff;border-radius:16px"><b style="font-size:17px">👨‍👩‍👧 Avisar a família</b><div style="font-size:13px;font-weight:400;margin-top:3px">Mande fotos e o local. A equipe AutoLink confere e avisa a família.</div></button>
   <button class="s" id="chM" style="width:100%;text-align:left;padding:16px;background:#fff;color:#b91c1c;border:2px solid #ef4444;border-radius:16px;margin-top:10px"><b style="font-size:17px">🩺 Ficha médica</b><div style="font-size:13px;font-weight:400;color:#444;margin-top:3px">Para quem está socorrendo. A equipe AutoLink confere seus dados e libera.</div></button>`;
  document.getElementById('chF').onclick=accidentForm;document.getElementById('chM').onclick=medForm;
}
function medShow(f){
  const left=Math.max(0,new Date(f.expiresAt)-new Date()),h=Math.floor(left/36e5),mi=Math.floor(left%36e5/6e4),fam=String(f.famPhone||'').replace(/\D/g,'');
  app.innerHTML=`<h2>🩺 Ficha médica</h2><div style="font-size:13px;color:#b45309;font-weight:700">Liberada pela equipe AutoLink · expira em ${h}h ${mi}min</div>
   <div style="background:#fee2e2;border-radius:14px;padding:14px;margin:10px 0;font-size:16px;line-height:1.7">${f.medOn?`<b>${esc(f.name||'')}</b><br>Tipo sanguíneo: <b style="font-size:22px">${esc(f.blood||'não informado')}</b><br>Alergias: ${esc(f.allergies||'—')}<br>Condições: ${esc(f.conditions||'—')}<br>Plano de saúde: ${esc(f.healthPlan||'—')}`:'O dono não cadastrou ficha médica. Use o contato da família abaixo.'}</div>
   ${fam?`<a href="tel:${fam}" style="display:block;text-align:center;padding:14px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:800">📞 Ligar para a família${f.famName?' ('+esc(f.famName)+')':''}</a>`:''}
   <p style="font-size:12px;color:#777">Dados protegidos pela LGPD. Use só para o atendimento.</p>`;
}
function medTeam(){
  const I='width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;margin-bottom:8px';
  app.innerHTML=`<h2>🩺 Ficha médica liberada</h2><p>Você está socorrendo o motorista? Identifique-se para ver a ficha. Fica registrado.</p>
   <input id="tn" placeholder="Seu nome" maxlength="100" style="${I}"><input id="tc" placeholder="Seu CPF" inputmode="numeric" maxlength="14" style="${I}"><input id="tw" placeholder="Seu WhatsApp com DDD" inputmode="tel" maxlength="20" style="${I}">
   <button class="s" id="tgo" style="width:100%;padding:14px;background:#ef4444;color:#fff">Sou da equipe: ver ficha</button>`;
  document.getElementById('tgo').onclick=async e=>{const v=id=>document.getElementById(id).value.trim(),cpf=v('tc').replace(/\D/g,''),w=v('tw').replace(/\D/g,'');
    if(v('tn').length<2)return alert('Digite seu nome.');if(cpf.length!==11)return alert('O CPF precisa ter 11 números.');if(w.length<10||w.length>13)return alert('Digite o WhatsApp com DDD.');
    const b=e.target;b.disabled=true;b.textContent='Abrindo...';
    try{await api('/medAccess?documentId='+car.id+'_'+S.uid,'POST',{fields:fields({carId:car.id,by:S.uid,name:v('tn'),cpf,wa:w,at:new Date()})}).catch(()=>{});
      medShow(unpack(await api('/medOpen/'+car.id)));}
    catch(err){alert('Não foi possível abrir a ficha. Ela pode ter expirado.');b.disabled=false;b.textContent='Sou da equipe: ver ficha';}};
}
function medForm(){
  const T=['Médico (CRM)','Enfermeiro (COREN)','Socorrista SAMU','Bombeiro','Policial','Outro profissional de saúde'];
  const I='width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;margin-bottom:8px';
  app.innerHTML=`<h2>🩺 Pedido de ficha médica</h2><p>Se o dono deste carro cadastrou uma ficha médica (tipo sanguíneo, alergias, doenças), a <b>equipe AutoLink</b> confere sua identificação e <b>liga para você</b> com as informações.</p>
   <p style="background:#fee2e2;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;font-size:14px">🚨 Ligue <b>192 (SAMU)</b> ou <b>193 (Bombeiros)</b> antes de tudo. Os dados nunca aparecem nesta tela.</p>
   <input id="mn" placeholder="Seu nome completo" maxlength="100" style="${I}"><input id="mc" placeholder="Seu CPF" inputmode="numeric" maxlength="14" style="${I}">
   <select id="mt" style="${I}">${T.map(x=>`<option>${x}</option>`).join('')}</select>
   <input id="mr" placeholder="Registro profissional, se tiver (ex: CRM 123456/SP)" maxlength="40" style="${I}"><input id="mp" placeholder="Seu WhatsApp com DDD (você recebe a ficha por ele)" inputmode="tel" maxlength="20" style="${I}">
   <textarea id="mw" maxlength="300" placeholder="Onde você está e o que aconteceu?" style="${I};min-height:70px"></textarea><button type="button" class="q" id="mloc" style="width:100%;margin-bottom:8px">📍 Incluir minha localização</button>
   <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:10px"><input type="checkbox" id="mk" style="width:20px;height:20px;flex:none"> Declaro que as informações são verdadeiras e que usarei os dados só para o atendimento. Falsa identidade é crime.</label>
   <button class="s" id="ms" style="width:100%;padding:14px">Enviar pedido à equipe AutoLink</button>`;
  window._mpos=null;document.getElementById('mloc').onclick=e=>{e.target.textContent='Obtendo localização...';navigator.geolocation.getCurrentPosition(p=>{_mpos=p.coords;e.target.textContent='📍 Localização incluída ✅';},()=>{e.target.textContent='Não foi possível pegar a localização';},{enableHighAccuracy:true,timeout:15000});};
  document.getElementById('ms').onclick=async e=>{const v=id=>document.getElementById(id).value.trim(),cpf=v('mc').replace(/\D/g,''),tel=v('mp').replace(/\D/g,'');
    if(v('mn').length<2)return alert('Digite seu nome.');
    if(cpf.length!==11)return alert('O CPF precisa ter 11 números.');
    if(tel.length<10||tel.length>13)return alert('Digite o telefone com DDD (ex: 98 98430-2999).');
    if(!v('mw'))return alert('Conte rapidamente o que aconteceu.');
    if(!document.getElementById('mk').checked)return alert('Marque a declaração para continuar.');
    const b=e.target;b.disabled=true;b.textContent='Enviando...';
    try{await api('/medRequests','POST',{fields:fields({...(window._mpos?{lat:String(_mpos.latitude),lng:String(_mpos.longitude)}:{}),carId:car.id,carName:car.name||'',ownerId:car.ownerId||'',authorId:S.uid,name:v('mn'),cpf,kind:v('mt'),reg:v('mr'),phone:tel,where:v('mw'),status:'pending',createdAt:new Date()})});
      app.innerHTML='<div class="okb">✅ <b>Pedido enviado!</b> A equipe AutoLink vai conferir seus dados. Quando a ficha for liberada, você recebe o link no seu WhatsApp. Continue o atendimento e, se precisar, ligue 192.</div>';}
    catch(err){alert('Não foi possível enviar: '+err.message);b.disabled=false;b.textContent='Enviar pedido à equipe AutoLink';}};
}
function accidentForm(){const ph=[];let pos=null;
  app.innerHTML=`<h2>🚑 Acidente com o ${esc(car.name)}</h2><p>Obrigado por ajudar! Tire fotos do carro e do local. A equipe AutoLink <b>avisa a família do dono</b> na hora.</p>
   <p style="background:#fee2e2;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;font-size:14px">🚨 Se houver feridos, ligue <b>192 (SAMU)</b> ou <b>193 (Bombeiros)</b> antes de tudo.</p>
   <div id="aph"></div><textarea id="ad" maxlength="300" placeholder="O que aconteceu? (obrigatório)" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #ddd;font:inherit;min-height:80px"></textarea>
   <button class="q" id="aloc">📍 Incluir localização (obrigatório)</button><button class="s" id="asend" style="width:100%;padding:14px;margin-top:6px">Enviar para a equipe AutoLink</button>`;
  const draw=()=>{const b=document.getElementById('aph');b.innerHTML=`<p class="muted">Fotos do carro e do local (obrigatório, até 5) · ${ph.length}/5</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${ph.map((p,i)=>`<div style="position:relative"><img src="${p}" style="width:76px;height:76px;object-fit:cover;border-radius:10px"><button data-x="${i}" style="position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:22px;height:22px;background:#ef4444;color:#fff">✕</button></div>`).join('')}${ph.length<5?'<label style="width:76px;height:76px;border:2px dashed #bbb;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px">📷<input type="file" accept="image/*" capture="environment" hidden></label>':''}</div>`;
    const i=b.querySelector('input');if(i)i.onchange=async()=>{if(i.files[0]){ph.push(await shrink(i.files[0]));draw();}};b.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{ph.splice(+x.dataset.x,1);draw();});};draw();
  document.getElementById('aloc').onclick=e=>{e.target.textContent='Obtendo localização...';navigator.geolocation.getCurrentPosition(p=>{pos=p.coords;e.target.textContent='📍 Localização incluída ✅';},()=>{e.target.textContent='Não foi possível pegar a localização';},{enableHighAccuracy:true,timeout:15000});};
  document.getElementById('asend').onclick=async e=>{if(!ph.length)return alert('Tire pelo menos 1 foto.');if(!pos)return alert('Toque em "Incluir localização" para a família saber onde foi.');if(!document.getElementById('ad').value.trim())return alert('Conte rapidamente o que aconteceu.');e.target.disabled=true;e.target.textContent='Enviando...';
    try{const f={authorId:S.uid,ownerId:car.ownerId,carId,carName:car.name,reporter:'visitor',reporterName:vName(),desc:document.getElementById('ad').value.trim(),photo:ph[0],lat:pos?String(pos.latitude):'',lng:pos?String(pos.longitude):'',status:'pending',createdAt:new Date()};
      if(ph[1])f.photo2=ph[1];if(ph[2])f.photo3=ph[2];if(ph[3])f.photo4=ph[3];if(ph[4])f.photo5=ph[4];await api('/accidents','POST',{fields:fields(f)});
      app.innerHTML='<div class="okb">✅ <b>Enviado!</b><br>A equipe AutoLink vai avisar a família do dono. Obrigado por ajudar.</div>';}
    catch(err){alert('Não foi possível enviar: '+err.message);e.target.disabled=false;e.target.textContent='Enviar para a equipe AutoLink';}};}
function rateBox(){const r=document.getElementById('rate');if(!r)return;let st=0;
  r.innerHTML=`<div style="background:#fff;border:2px solid #FF6B00;border-radius:14px;padding:14px;margin-bottom:14px;text-align:center"><b style="font-size:18px">🏢 Como estou dirigindo?</b><div class="muted">Avalie o motorista deste veículo da empresa</div>
   <div id="stars" style="font-size:36px;margin:8px 0;cursor:pointer">${[1,2,3,4,5].map(i=>`<span data-s="${i}">☆</span>`).join('')}</div>
   <input id="rc" maxlength="200" placeholder="Comentário (opcional)" style="width:100%;margin-bottom:8px"><button class="s" id="rs" style="width:100%;padding:12px">Enviar avaliação</button></div>`;
  r.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{st=+x.dataset.s;r.querySelectorAll('[data-s]').forEach(y=>y.textContent=+y.dataset.s<=st?'⭐':'☆');});
  document.getElementById('rs').onclick=async()=>{if(!st)return alert('Escolha de 1 a 5 estrelas');
    try{await api('/ratings','POST',{fields:{carId:{stringValue:carId},ownerId:{stringValue:car.ownerId},stars:{integerValue:String(st)},comment:{stringValue:document.getElementById('rc').value.trim()},at:{timestampValue:new Date().toISOString()},by:{stringValue:S.uid}}});
      r.innerHTML='<div style="background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;text-align:center">✅ Obrigado pela avaliação!</div>';}catch(e){alert('Não foi possível enviar: '+e.message);}};}
</script></body></html>
