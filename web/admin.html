<script>
const KEY='AIzaSyBSGj1H273wiXM-VgpkytnC3kX6yQlt8_I',BASE='https://firestore.googleapis.com/v1/projects/autolink-1aa51/databases/(default)/documents',DOC='projects/autolink-1aa51/databases/(default)/documents';
const SITE=location.origin+location.pathname.replace('admin.html','');

const enc=v=>v instanceof Date?{timestampValue:v.toISOString()}:{stringValue:String(v)};
async function api(path,method='GET',body){const r=await fetch(BASE+path,{method,headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||JSON.stringify(j));return j;}
function loginView(msg=''){m.innerHTML=`<div class="box"><h3>Entrar</h3><p class="muted">${msg}</p><input id="e" type="email" placeholder="E-mail"><input id="p" type="password" placeholder="Senha"><button id="go">Entrar</button><button class="gray" id="fg">Esqueci minha senha</button></div>`;
  fg.onclick=()=>forgot(e.value);

    if(!r.idToken)return loginView('E-mail ou senha incorretos.');S={uid:r.localId,token:r.idToken,email:e.value.trim()};sessionStorage.setItem('adm',JSON.stringify(S));main();};}
async function forgot(pre){const em=(prompt('Digite o e-mail da sua conta de administrador:',pre||S?.email||'')||'').trim();if(!em)return;
  await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestType:'PASSWORD_RESET',email:em})});
  alert('Se este e-mail tiver conta, chegará um link para criar uma nova senha. Confira também o spam.');}
// Pede a senha antes de ações perigosas
function askPass(title){return new Promise(ok=>{const d=document.createElement('div');d.className='pw';
  d.innerHTML=`<div class="pwb"><h3>🔒 ${title}</h3><p class="muted">Confirme sua senha de administrador.</p><input type="password" id="pwI" placeholder="Senha" autocomplete="current-password"><p class="muted err" id="pwE"></p><button id="pwOk">Confirmar</button><button class="gray" id="pwNo">Cancelar</button><button class="gray" id="pwFg" style="background:none;color:#FF6B00">Esqueci minha senha</button></div>`;
  document.body.appendChild(d);const I=d.querySelector('#pwI');I.focus();const end=v=>{d.remove();ok(v);};
  d.querySelector('#pwNo').onclick=()=>end(false);d.querySelector('#pwFg').onclick=()=>{end(false);forgot();};
  const go=async()=>{if(!S.email){end(false);alert('Saia e entre de novo para confirmar sua senha.');sessionStorage.clear();return location.reload();}
    const r=await(await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:S.email,password:I.value,returnSecureToken:true})})).json();
    if(!r.idToken){d.querySelector('#pwE').textContent='Senha incorreta.';I.value='';I.focus();return;}S.token=r.idToken;sessionStorage.setItem('adm',JSON.stringify(S));end(true);};
  d.querySelector('#pwOk').onclick=go;I.onkeydown=e=>{if(e.key==='Enter')go();};});}
async function isAdmin(){try{await api('/admins/'+S.uid);return true}catch(e){return false}}
async function main(){
  if(!S)return loginView();
  if(!await isAdmin()){m.innerHTML=`<div class="box"><h3>Quase lá</h3><p>Sua conta ainda não é administradora. No Firebase, em <b>Firestore</b>, crie a coleção <code>admins</code> com um documento cujo ID é:</p><p><code style="font-size:18px">${S.uid}</code></p><p class="muted">(pode deixar sem campos, ou adicione nome: string). Depois recarregue esta página.</p><button onclick="sessionStorage.clear();location.reload()">Sair</button></div>`;return;}
  m.innerHTML=`<div class="box" data-tab="adesivos"><h3>Gerar lote de adesivos</h3><p class="muted">Cada adesivo recebe um código único. O cliente ativa no app depois de colar no carro.</p>
  <input id="n" type="number" value="12" min="1" max="200"><input id="lote" placeholder="Nome do lote (ex: Lote 1 - Nov/2026)">
  <button id="gen">Gerar adesivos</button><button onclick="print()">Imprimir / PDF</button>
  <p id="info" class="muted"></p></div>
  <div class="box" data-tab="alertas"><h3>🚨 Alertas regionais</h3><div id="alr" class="muted">Carregando...</div></div>
  <div class="box" data-tab="repo"><h3>🔁 Reposição de adesivo</h3><div id="rps" class="muted">Carregando...</div></div>
  <div class="box" data-tab="lixo"><h3>🗂️ QRs desativados</h3><div id="trs" class="muted">Carregando...</div></div>
  <div class="box" data-tab="acidentes"><h3>🚑 Acidentes</h3><div id="acc" class="muted">Carregando...</div></div>
  <div class="box" data-tab="ajuda"><h3>💬 Central de ajuda</h3><div id="tks" class="muted">Carregando...</div></div>
  <div class="box" data-tab="ajuda" id="tkBox" style="display:none;position:relative"><button class="x" onclick="tkBox.style.display='none'" aria-label="Fechar">✕</button><h3 id="tkT"></h3><div id="tkM" class="thread"></div><textarea id="tkR" placeholder="Responder ao cliente..."></textarea><button id="tkS">Enviar resposta</button><button class="gray" id="tkC">Marcar como resolvido</button></div>
  <div class="box" data-tab="anuncios"><h3>📣 Pedidos de anunciantes</h3><div id="ads" class="muted">Carregando...</div></div>
  <div class="box" data-tab="numeros"><h3>📊 Números do AutoLink</h3><div id="kpi" class="muted">Carregando...</div></div>
  <div class="box" data-tab="adesivos"><h3>Histórico de lotes</h3><div id="hist" class="muted">Carregando...</div></div>
  <div class="box" data-tab="adesivos" id="detBox" style="display:none;position:relative"><button class="x" onclick="closeBatch()" title="Fechar" aria-label="Fechar">✕</button><h3 id="detT" style="padding-right:40px"></h3><div id="det"></div></div><div class="sheet" id="sheet"></div>`;
  gen.onclick=generate;history();home();refreshAll();setInterval(refreshAll,30000);}
let TAB=null;const TABS=[['numeros','📊','Números','Usuários, adesivos e conversas'],['adesivos','🏷️','Adesivos','Gerar, imprimir e acompanhar lotes'],['alertas','🚨','Alertas','Aprovar alertas regionais'],['acidentes','🚑','Acidentes','Analisar e avisar a família'],['ajuda','💬','Central de ajuda','Responder clientes'],['repo','🔁','Reposição de adesivo','Danificados e perdidos'],['lixo','🗂️','QRs desativados','Desfazer ou apagar de vez'],['anuncios','📣','Anunciantes e vendedores','Pedidos para anunciar ou vender']];
function home(){TAB=null;hb.hidden=true;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.add('hide'));sheet.style.display='none';
  hub.hidden=false;hub.innerHTML=`<h2 style="margin:4px 0 14px">Olá! O que você quer fazer?</h2><div class="hubg">${TABS.map(([k,e,l,d])=>`<button data-k="${k}"><span class="e">${e}</span><b>${l}</b><small>${d}</small><span class="bd" id="bd-${k}"></span></button>`).join('')}</div>`;
  hub.querySelectorAll('button').forEach(b=>b.onclick=()=>tab(b.dataset.k));badges();scrollTo(0,0);}
function tab(t){TAB=t;if(t==='numeros')numbers();hub.hidden=true;hb.hidden=false;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('hide',x.dataset.tab!==t));sheet.style.display=t==='adesivos'?'':'none';scrollTo(0,0);}
let BD={};function badges(){for(const k in BD){const e=document.getElementById('bd-'+k);if(e)e.textContent=BD[k]?BD[k]:'';}
  const n=(BD.repo||0)+(BD.acidentes||0)+(BD.alertas||0)+(BD.ajuda||0)+(BD.anuncios||0);const b=document.getElementById('bellN');if(b)b.textContent=n?n:'';}
function pend(){TAB=null;hb.hidden=false;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.add('hide'));sheet.style.display='none';hub.hidden=false;
  const L=[['repo','🔁','pedido(s) de adesivo novo'],['acidentes','🚑','acidente(s) para analisar'],['alertas','🚨','alerta(s) para aprovar'],['ajuda','💬','mensagem(ns) de clientes'],['anuncios','📣','pedido(s) de anúncio, venda ou empresa']].filter(([k])=>BD[k]);
  hub.innerHTML=`<h2 style="margin:4px 0 14px">🔔 Pendências</h2>`+(L.length?`<div class="hubg">${L.map(([k,e,t])=>`<button data-k="${k}"><span class="e">${e}</span><b>${BD[k]} ${t}</b><small>Toque para abrir</small></button>`).join('')}</div>`:'<div class="box">✅ Nada pendente. Tudo em dia!</div>');
  hub.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>tab(b.dataset.k));scrollTo(0,0);}
function refreshAll(){repos().catch(()=>{});accidents().catch(()=>{});alerts().catch(()=>{});tickets().catch(()=>{});adsList().catch(()=>{});}
const pk=f=>Object.fromEntries(Object.entries(f||{}).map(([k,v])=>[k,'timestampValue' in v?new Date(v.timestampValue):'booleanValue' in v?v.booleanValue:v.stringValue]));
const q=async(col,parent='',order)=>(await api(parent+':runQuery','POST',{structuredQuery:Object.assign({from:[{collectionId:col}]},order?{orderBy:[{field:{fieldPath:order},direction:'ASCENDING'}]}:{})})).filter(x=>x.document).map(x=>({id:x.document.name.split('/').pop(),...pk(x.document.fields)}));
async function numbers(){kpi.innerHTML='Carregando...';
  const safe=async c=>{try{return await q(c)}catch(e){return null}};
  const [st,cars,chats,al,tk,ads]=await Promise.all(['stickers','cars','chats','alerts','tickets','adRequests'].map(safe));
  const now=Date.now(),d7=now-7*864e5,d30=now-30*864e5,n=v=>v==null?'—':v.toLocaleString('pt-BR');
  const owners=cars?new Set(cars.map(c=>c.ownerId)).size:null,act=st?st.filter(x=>x.carId).length:null;
  const K=[['👤','Donos com carro cadastrado',n(owners)],['🚗','Carros cadastrados',n(cars?.length)],['🏷️','Adesivos gerados',n(st?.length)],
   ['✅','Adesivos ativados',n(act)+(st&&st.length?` <small>(${Math.round(act/st.length*100)}%)</small>`:'')],
   ['💬','Conversas (total)',n(chats?.length)],['📅','Conversas nos últimos 7 dias',n(chats?.filter(c=>c.updatedAt&&c.updatedAt>d7).length)],
   ['🗓️','Conversas nos últimos 30 dias',n(chats?.filter(c=>c.updatedAt&&c.updatedAt>d30).length)],['🚫','Conversas bloqueadas',n(chats?.filter(c=>c.blocked).length)],
   ['🚨','Alertas enviados',n(al?.length)],['🟢','Alertas aprovados',n(al?.filter(a=>a.status==='approved'||a.status==='removed').length)],
   ['🆘','Chamados de ajuda abertos',n(tk?.filter(t=>t.status!=='closed').length)],['📣','Pedidos de anúncio/venda',n(ads?.length)]];
  kpi.innerHTML=`<div class="kg">${K.map(([e,l,v])=>`<div class="kc"><div class="e">${e}</div><div class="v">${v}</div><div class="muted">${l}</div></div>`).join('')}</div>
   <p class="muted" style="margin-top:12px">Atualizado em ${new Date().toLocaleString('pt-BR')}. ${cars===null||chats===null?'⚠️ Alguns números precisam das regras novas do Firebase.':''}</p><button class="sm" onclick="numbers()">Atualizar</button>`;}
const RR={damaged:'🩹 Danificado',faded:'🌫️ Desbotado',lost:'❓ Perdido',stolen:'🚨 Roubado',newcar:'🚗 Trocou o vidro'};
async function repos(){const l=(await q('replacements')).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));BD.repo=l.filter(r=>r.status==='pending').length;badges();
  const ST={pending:'⏳ Aguardando',sent:'📦 Enviado',done:'✅ Concluído',rejected:'❌ Cancelado'};
  rps.innerHTML=l.length?`<p><b>${BD.repo}</b> aguardando</p><table><tr><th>Cliente</th><th>Pedido</th><th>Entrega</th><th></th></tr>${l.map(r=>`<tr><td><b>${esc(r.name||'—')}</b><div class="muted">${esc(r.phone||'')}<br>${esc(r.email||'')}</div></td>
   <td>${ST[r.status]||r.status}<div>${RR[r.reason]||r.reason} · ${esc(r.carName)}</div><div class="muted">Antigo: ${esc(r.oldCode)}${r.newCode?' → Novo: <b>'+esc(r.newCode)+'</b>':''}<br>${r.createdAt?r.createdAt.toLocaleString('pt-BR'):''}${r.note?'<br>'+esc(r.note):''}</div></td>
   <td class="muted">${esc(r.address)}</td><td class="trb">${r.status==='pending'?`<button class="sm" data-g="${r.id}">Gerar adesivo novo</button><button class="sm red" data-c="${r.id}">Cancelar</button>`:r.status==='sent'?`<button class="sm" data-p="${r.id}">Imprimir de novo</button><button class="sm gray" data-d="${r.id}">Concluído</button>`:''}</td></tr>`).join('')}</table>`:'Nenhum pedido de reposição.';
  const f=id=>l.find(r=>r.id===id);
  const setSt=async(id,st,extra={})=>{const flds=Object.assign({status:enc(st)},extra);await api('/replacements/'+id+'?'+Object.keys(flds).map(k=>'updateMask.fieldPaths='+k).join('&'),'PATCH',{fields:flds});repos();};
  rps.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{const r=f(b.dataset.g);if(!confirm(`Gerar adesivo novo para ${r.name||'o cliente'}?\n\nO adesivo antigo ${r.oldCode} será desativado.`))return;
    try{const c=code(),pin=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000),now=new Date();
      await api(':commit','POST',{writes:[{update:{name:DOC+'/stickers/'+c,fields:{batch:enc('Reposição'),createdAt:enc(now)}},currentDocument:{exists:false}},{update:{name:DOC+'/stickerSecrets/'+c,fields:{pin:enc(pin)}}},
        {update:{name:DOC+'/stickers/'+r.oldCode,fields:{disabled:{booleanValue:true},disabledAt:enc(now)}},updateMask:{fieldPaths:['disabled','disabledAt']}}]});
      await api(':commit','POST',{writes:[{update:{name:DOC+'/cars/'+r.carId,fields:{}},updateMask:{fieldPaths:['stickerCode']},currentDocument:{exists:true}}]}).catch(()=>{});
      await setSt(r.id,'sent',{newCode:enc(c),sentAt:enc(now)});history();tab('adesivos');render([c],{[c]:pin});info.textContent=`Adesivo ${c} gerado para ${r.name||'o cliente'}. Imprima e envie junto com o cartão de ativação.`;
    }catch(e){alert('Erro: '+e.message);}});
  rps.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{const r=f(b.dataset.p);let pin='';try{pin=(await api('/stickerSecrets/'+r.newCode)).fields.pin.stringValue}catch(e){}tab('adesivos');render([r.newCode],{[r.newCode]:pin});});
  rps.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setSt(b.dataset.d,'done'));
  rps.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>confirm('Cancelar este pedido?')&&setSt(b.dataset.c,'rejected'));}
async function accidents(){const l=(await q('accidents')).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const pend=l.filter(a=>a.status==='pending');BD.acidentes=pend.length;badges();
  if(!l.length){acc.innerHTML='Nenhum registro de acidente.';return;}

let ALL=[];
async function history(){
  const r=await api(':runQuery','POST',{structuredQuery:{from:[{collectionId:'stickers'}]}});
  ALL=r.filter(x=>x.document).map(x=>{const f=x.document.fields;return{code:x.document.name.split('/').pop(),batch:f.batch?.stringValue||'(sem nome)',created:f.createdAt?new Date(f.createdAt.timestampValue):null,active:!!f.carId,carId:f.carId?.stringValue||null,disabled:!!f.disabled?.booleanValue,disabledAt:f.disabledAt?new Date(f.disabledAt.timestampValue):null,activated:f.activatedAt?new Date(f.activatedAt.timestampValue):null}});
  const g={};for(const x of ALL.filter(y=>!y.disabled)){(g[x.batch]??={name:x.batch,date:x.created,list:[]}).list.push(x);if(x.created&&(!g[x.batch].date||x.created<g[x.batch].date))g[x.batch].date=x.created;}
  const rows=Object.values(g).sort((a,b)=>(b.date||0)-(a.date||0));
  const tot=ALL.filter(x=>!x.disabled).length,act=ALL.filter(x=>x.active&&!x.disabled).length;trash();
  hist.innerHTML=rows.length?`<p><b>${tot}</b> adesivos gerados · <b>${act}</b> ativados (${tot?Math.round(act/tot*100):0}%)</p><table>
   <tr><th>Lote</th><th>Data</th><th>Gerados</th><th>Ativados</th><th></th></tr>${rows.map((b,i)=>`<tr><td>${esc(b.name)}</td><td>${b.date?b.date.toLocaleDateString('pt-BR'):''}</td><td>${b.list.length}</td><td>${b.list.filter(x=>x.active).length}</td><td><button class="sm" data-i="${i}">Ver / imprimir</button></td></tr>`).join('')}</table>`:'Nenhum lote gerado ainda.';
  hist.querySelectorAll('button[data-i]').forEach(bt=>bt.onclick=()=>showBatch(rows[+bt.dataset.i]));}
async function showBatch(b){
  detBox.style.display='';detT.textContent='Lote: '+b.name;
  det.innerHTML=`<table><tr><th>Código</th><th>Situação</th><th>Ativado em</th><th></th></tr>${b.list.sort((x,y)=>x.code.localeCompare(y.code)).map(x=>`<tr><td><b>${x.code}</b></td><td>${x.active?'<span style="color:#1a7f37">● Ativado</span>':'<span style="color:#999">○ Disponível</span>'}</td><td>${x.activated?x.activated.toLocaleString('pt-BR'):''}</td><td><button class="sm red" data-del="${x.code}" title="Apagar este QR">⛔ Desativar</button></td></tr>`).join('')}</table><button onclick="print()">Imprimir este lote</button><button class="gray" id="renB">Renomear</button><button class="red" id="delB">Apagar lote</button>`;

async function renameBatch(b){
  const n=(prompt('Novo nome do lote:',b.name)||'').trim();if(!n||n===b.name)return;
  try{for(let i=0;i<b.list.length;i+=400){const part=b.list.slice(i,i+400);
    await api(':commit','POST',{writes:part.map(x=>({update:{name:DOC+'/stickers/'+x.code,fields:{batch:{stringValue:n}}},updateMask:{fieldPaths:['batch']}}))});}
    b.name=n;detT.textContent='Lote: '+n;info.textContent=`Lote renomeado para "${n}".`;history();
  }catch(e){alert('Erro ao renomear: '+e.message);}}
async function deleteOne(b,x){
  if(!confirm(`Desativar o QR ${x.code}?`+(x.active?'\n\n⚠️ Este adesivo JÁ FOI ATIVADO por um cliente. Ele vai parar de funcionar no carro dele.':'')+'\n\nEle vai para "QRs desativados", onde você pode desfazer ou apagar de vez.'))return;
  if(!await askPass('Desativar QR '+x.code))return;
  try{await softDel([x]);info.textContent=`QR ${x.code} desativado.`;b.list=b.list.filter(y=>y!==x);b.list.length?showBatch(b):closeBatch();history();}catch(e){alert('Erro: '+e.message);}}
async function softDel(list,on=true){for(let i=0;i<list.length;i+=400){const part=list.slice(i,i+400);
  await api(':commit','POST',{writes:part.map(x=>({update:{name:DOC+'/stickers/'+x.code,fields:on?{disabled:{booleanValue:true},disabledAt:enc(new Date())}:{disabled:{booleanValue:false}}},updateMask:{fieldPaths:on?['disabled','disabledAt']:['disabled']}}))});}}
async function hardDel(x){const w=[{delete:DOC+'/stickers/'+x.code},{delete:DOC+'/stickerSecrets/'+x.code}];
  if(x.carId)w.push({update:{name:DOC+'/cars/'+x.carId,fields:{}},updateMask:{fieldPaths:['stickerCode']},currentDocument:{exists:true}});
  await api(':commit','POST',{writes:w}).catch(async e=>{if(x.carId)await api(':commit','POST',{writes:w.slice(0,2)});else throw e;});}
async function trash(){const box=document.getElementById('trs');const l=ALL.filter(x=>x.disabled).sort((a,b)=>(b.disabledAt||0)-(a.disabledAt||0));
  BD.lixo=l.length;badges();
  box.innerHTML=l.length?`<p class="muted">${l.length} QR(s) desativado(s). Eles não funcionam enquanto estiverem aqui.</p><table><tr><th>Código</th><th>Lote</th><th>Desativado em</th><th></th></tr>${l.map(x=>`<tr><td><b>${x.code}</b>${x.active?'<div class="muted">já ativado</div>':''}</td><td>${esc(x.batch)}</td><td>${x.disabledAt?x.disabledAt.toLocaleString('pt-BR'):''}</td>
   <td class="trb"><button class="sm" data-u="${x.code}">↩️ Desfazer</button> <button class="sm red" data-k="${x.code}">Apagar de vez</button></td></tr>`).join('')}</table>
   <button class="gray" id="tru">↩️ Restaurar todos</button> <button class="red" id="trk">Apagar todos de vez</button>`:'Nenhum QR desativado.';
  const f=c=>l.find(x=>x.code===c);
  box.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{await softDel([f(b.dataset.u)],false);await history();trash();});
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{if(!confirm('Apagar o QR '+b.dataset.k+' DE VEZ? Não dá para desfazer.'))return;if(!await askPass('Apagar de vez'))return;
    try{await hardDel(f(b.dataset.k));await history();trash();}catch(e){alert(e.message);}});
  const u=document.getElementById('tru'),k=document.getElementById('trk');
  if(u)u.onclick=async()=>{await softDel(l,false);await history();trash();};
  if(k)k.onclick=async()=>{if(!confirm(`Apagar ${l.length} QR(s) DE VEZ? Não dá para desfazer.`))return;if(!await askPass('Apagar todos de vez'))return;
    for(const x of l)await hardDel(x).catch(()=>{});await history();trash();};}
async function deleteBatch(b){
  const free=b.list.filter(x=>!x.active),act=b.list.length-free.length;
  if(!free.length)return alert('Todos os adesivos deste lote já foram ativados por clientes. Eles não podem ser apagados.');
  const aviso=act?`\n\n${act} adesivo(s) já ativado(s) por clientes serão MANTIDOS, para não quebrar o adesivo deles.`:'';
  if(!confirm(`Apagar ${free.length} adesivo(s) não ativado(s) do lote "${b.name}"?${aviso}\n\nEles vão para "QRs desativados", onde você pode desfazer ou apagar de vez.`))return;
  if(!await askPass('Apagar lote'))return;
  try{for(let i=0;i<free.length;i+=200){const part=free.slice(i,i+200);
    await softDel(part);}
    closeBatch();info.textContent=`${free.length} adesivo(s) do lote "${b.name}" foram para QRs desativados.`;history();
  }catch(e){alert('Erro ao apagar: '+e.message);}}
const AT={incendio:'🔥 Incêndio',enchente:'🌊 Enchente',acidente:'💥 Acidente',bloqueio:'🚧 Via bloqueada',roubo:'🚨 Roubo / assalto',outro:'⚠️ Outro'};

const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';const code=()=>'AL-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>ALPHA[b%ALPHA.length]).join('');
async function generate(){const n=Math.min(200,Math.max(1,+document.getElementById('n').value||0)),b=lote.value.trim()||('Lote '+new Date().toLocaleDateString('pt-BR'));
  const codes=Array.from({length:n},code),now=new Date(),pins={};codes.forEach(c=>pins[c]=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000));

  catch(e){return alert('Erro ao gerar: '+e.message+'\nTente de novo.');}
