<section class="pg dark" style="align-items:center;text-align:center;padding-top:11mm"><div class="hole"></div>
 <img src="../web/logo-car-white.png" style="width:34mm">
 <p style="font-weight:900;font-size:11pt;margin-top:1mm">AutoLink é um aplicativo</p>
 <p class="mut" style="margin:1.5mm 0 3mm">Conecta você a quem está perto do seu carro, com privacidade, e reúne tudo do seu veículo num só lugar: avisos, alertas, documentos, manutenção, família e mercado.</p>
 <div style="display:flex;gap:6mm">
  <div><div style="background:#fff;padding:2mm;border-radius:2.5mm;width:30mm" class="qr" data-q="qa"></div><p style="font-size:8pt;font-weight:800;margin-top:1.5mm">🤖 Android</p><p class="mut" style="font-size:6.5pt">Google Play</p></div>
  <div><div style="background:#fff;padding:2mm;border-radius:2.5mm;width:30mm" class="qr" data-q="qi"></div><p style="font-size:8pt;font-weight:800;margin-top:1.5mm"> iPhone</p><p class="mut" style="font-size:6.5pt">App Store</p></div>
 </div>
 <p class="mut" style="margin-top:3mm">Conteúdo: 1 adesivo traseiro + 1 adesivo da frente + PIN de ativação. Válido para 1 veículo.</p>

<script>
// Uso: livreto.html  (exemplo)  ou  livreto.html#AL-ABC12:123456,AL-XYZ:654321  (gerado pelo ADM)
const ROOT=location.href.split('#')[0].replace(/kit\/livreto\.html.*$/,'');
const APP=ROOT+'web/app.html';
function qr(el,t){new QRCode(el,{colorDark:'#111',colorLight:'#fff',text:t,width:500,height:500,correctLevel:QRCode.CorrectLevel.M});}
function ean(sv){const base='789000000001';let s=0;for(let i=0;i<12;i++)s+=(+base[i])*(i%2?3:1);const code=base+((10-s%10)%10);
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],
G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],
R=L.map(x=>x.replace(/./g,c=>c==='0'?'1':'0')),P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
let bits='101';const p=P[+code[0]];for(let i=1;i<7;i++)bits+=(p[i-1]==='L'?L:G)[+code[i]];bits+='01010';for(let i=7;i<13;i++)bits+=R[+code[i]];bits+='101';
const W=95+18,u=100/W;let h='';
for(let i=0;i<bits.length;i++)if(bits[i]==='1'){const g=i<3||(i>=45&&i<50)||i>=92;h+=`<rect x="${(i+9)*u}%" y="0" width="${u}%" height="${g?'84%':'74%'}" fill="#000"/>`;}
h+=`<text x="${2*u}%" y="99%" font-size="6" font-family="monospace">${code[0]}</text><text x="${33*u}%" y="99%" font-size="6" font-family="monospace" text-anchor="middle">${code.slice(1,7)}</text><text x="${80*u}%" y="99%" font-size="6" font-family="monospace" text-anchor="middle">${code.slice(7)}</text>`;
sv.innerHTML=h;}
const kits=(decodeURIComponent(location.hash.slice(1))||'AL-EXEMPLO:').split(',').filter(Boolean).map(x=>x.split(':'));
const out=document.getElementById('out'),tpl=document.getElementById('tpl');
for(const [code,pin] of kits){const f=tpl.content.cloneNode(true);const u=ROOT+'web/?s='+code;
  qr(f.querySelector('[data-q=q1]'),u);qr(f.querySelector('[data-q=q2]'),u);qr(f.querySelector('[data-q=qa]'),APP+'?os=android');qr(f.querySelector('[data-q=qi]'),APP+'?os=ios');
  if(pin)f.querySelector('.pin b').textContent=pin;f.querySelector('.code').textContent='Código do adesivo: '+code;ean(f.querySelector('.ean'));out.appendChild(f);}
if(/[?&]a4/.test(location.search)){const st=document.createElement('style');st.textContent='@page{size:297mm 210mm;margin:0}body{background:#fff}.sh{width:297mm;height:210mm;display:flex;gap:12mm;align-items:center;justify-content:center;page-break-after:always;position:relative}.sh .pg{margin:0!important;box-shadow:none!important;page-break-after:auto;outline:.2mm dashed #999}.tt{position:absolute;top:6mm;left:0;right:0;text-align:center;font:9pt Arial;color:#777}';document.head.appendChild(st);
  const pgs=[...document.querySelectorAll('.pg')];out.innerHTML='';for(let i=0;i<pgs.length;i+=2){const d=document.createElement('div');d.className='sh';d.innerHTML='<div class=tt>TESTE AutoLink · A4 deitado · escala 100% · recorte na linha tracejada · adesivo grande = 8×13 cm</div>';d.append(pgs[i]);if(pgs[i+1])d.append(pgs[i+1]);out.append(d);}}
if(location.hash.length>1)setTimeout(()=>print(),900);
</script></body></html>
